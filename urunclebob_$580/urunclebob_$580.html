<script>

    document.addEventListener('DOMContentLoaded', function () {
    const sites = [
  "https://www.insidetheyankees.com/wp-json/wp/v2/posts",
  "https://example2.com/wp-json/wp/v2/posts",
  "https://example3.com/wp-json/wp/v2/posts"
];

async function fetchAllPosts() {
  const requests = sites.map(url =>
    fetch(url + "?per_page=5&_embed").then(res => res.json())
  );

  const results = await Promise.all(requests);

  // merge all posts
  let allPosts = results.flat();

  // sort by latest date
  allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

  return allPosts;
}

function renderBulletins(posts) {
  const container = document.querySelector("#bulletins");
  container.innerHTML = "";

  posts.slice(0, 5).forEach(post => {
    const timeAgo = getTimeAgo(post.date);

    container.innerHTML += `
      <div class="bulletin-card" onclick="openPost('${post.link}')">
        <span class="tag">${post._embedded?.['wp:term']?.[0]?.[0]?.name || 'News'}</span>
        <span class="time">${timeAgo}</span>
        <h4>${post.title.rendered}</h4>
      </div>
    `;
  });
}

function openPost(url) {
  window.location.href = url;
}

function getBreakingNews(posts) {
  return posts.filter(post => post.tags.includes(12));
}

function renderBreaking(posts) {
  const ticker = document.querySelector("#breaking");

  ticker.innerHTML = posts.map(p => `
    <span onclick="openPost('${p.link}')">
      ${p.title.rendered}
    </span>
  `).join(" • ");
}

function getTimeAgo(date) {
  const seconds = Math.floor((new Date() - new Date(date)) / 1000);

  const intervals = {
    year: 31536000,
    month: 2592000,
    day: 86400,
    hour: 3600,
    minute: 60
  };

  for (let key in intervals) {
    const value = Math.floor(seconds / intervals[key]);
    if (value >= 1) return `${value}${key.charAt(0).toUpperCase()} AGO`;
  }

  return "JUST NOW";
}

(async function () {
  const posts = await fetchAllPosts();

  renderBulletins(posts);

  const breaking = getBreakingNews(posts);
  renderBreaking(breaking);
})();
    });

</script>

<div id="bulletins"></div>
<div id="breaking"></div>
