<style>
    .woocommerce-product-details__short-description.is-collapsed {
    display: -webkit-box !important;
    -webkit-box-orient: vertical !important;
    -webkit-line-clamp: 3 !important;
    overflow: hidden !important;
}

.woocommerce-product-details__short-description.is-expanded {
    display: block !important;
    overflow: visible !important;
}

.description-toggle {
    display: inline-block;
    margin-top: 8px;
    padding: 0;
    border: none;
    background: transparent;
    color: #0073aa;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.description-toggle:hover {
    text-decoration: underline;
}
</style>
<script>
    document.addEventListener('DOMContentLoaded', function () {

    const description = document.querySelector(
        '.woocommerce-product-details__short-description'
    );

    if (!description) return;

    // Add collapsed class
    description.classList.add('is-collapsed');

    // Create See More button
    const button = document.createElement('button');

    button.type = 'button';
    button.className = 'description-toggle';
    button.textContent = 'See More';

    description.after(button);

    // Toggle description
    button.addEventListener('click', function () {

        const isExpanded = description.classList.toggle('is-expanded');

        description.classList.toggle('is-collapsed', !isExpanded);

        button.textContent = isExpanded ? 'See Less' : 'See More';

    });

});
</script>

        position: absolute;
        inset: 0;
        opacity: 0;
        transform: translateY(100%);
        transition: opacity .5s ease, transform .5s ease;
        white-space: nowrap;
        pointer-events: none;
    }

    .elementor-icon-list-items .elementor-icon-list-item.is-active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }

    .elementor-icon-list-items .elementor-icon-list-item.is-exiting {
        opacity: 0;
        transform: translateY(-100%);
    }
}
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll('.elementor-icon-list-items').forEach(function (list) {

        const items = Array.from(list.querySelectorAll('.elementor-icon-list-item'));

        if (items.length <= 1) return;

        let currentIndex = 0;

        // Set initial active item
        items.forEach((item, index) => {
            item.classList.toggle('is-active', index === currentIndex);
        });

        function showRandomItem() {

            let nextIndex;

            // Prevent showing the same item twice consecutively
            do {
                nextIndex = Math.floor(Math.random() * items.length);
            } while (nextIndex === currentIndex);

            const currentItem = items[currentIndex];
            const nextItem = items[nextIndex];

            currentItem.classList.remove('is-active');
            currentItem.classList.add('is-exiting');

            nextItem.classList.remove('is-exiting');
            nextItem.classList.add('is-active');

            setTimeout(() => {
                currentItem.classList.remove('is-exiting');
            }, 500);

            currentIndex = nextIndex;
        }

        setInterval(showRandomItem, 3000);

    });

});
</script>


<style>
    
 /* Main menu wrapper */
.wp-slide-menu {
    position: relative;
    width: 100%;
    overflow: hidden;
    transition: height .4s ease;
}

/* All menu panels */
.wp-slide-menu ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

/* Main menu */
.wp-slide-menu > ul {
    position: relative;
    width: 100%;
}

/* Submenu panels */
.wp-slide-menu .sub-menu {
    position: absolute !important;
    inset: 0 auto auto 0;
    width: 100% !important;

    display: block !important;
    min-width: 100% !important;

    visibility: hidden;
    opacity: 0;
    transform: translateX(100%);

    pointer-events: none;

    transition:
        transform .4s ease,
        opacity .4s ease,
        visibility .4s ease;

    background: #fff;
    z-index: 2;
}

/* Active panel */
.wp-slide-menu ul.is-active {
    visibility: visible;
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

/* Previous panel slides to left */
/* .wp-slide-menu ul.is-before {
    visibility: hidden;
    opacity: 0;
    transform: translateX(-100%);
    pointer-events: none;
} */

/* Menu links */
.wp-slide-menu .menu-item > a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    text-decoration: none;
    color: #222;
}

/* Parent menu arrow */
.wp-slide-menu .menu-item-has-children > a::after {
    content: "›";
    font-size: 24px;
    margin-left: 10px;
}

/* Back button */
.wp-slide-menu .wp-slide-menu__back > a {
    justify-content: flex-start;
    font-weight: 600;
    border-bottom: 1px solid #eee;
}

.wp-slide-menu .wp-slide-menu__back > a::before {
    content: "←";
    margin-right: 10px;
    font-size: 20px;
}
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {

    document.querySelectorAll('.wp-slide-menu').forEach(function (wrapper) {

        const mainMenu = wrapper.querySelector(':scope > ul');

        if (!mainMenu) return;

        let currentPanel = mainMenu;
        const history = [];

        // Set initial panel
        mainMenu.classList.add('is-active');

        // Set wrapper height
        function updateHeight() {
            wrapper.style.height = currentPanel.scrollHeight + 'px';
        }

        // Create back buttons for all submenu levels
        wrapper.querySelectorAll('.sub-menu').forEach(function (submenu) {

            if (submenu.querySelector(':scope > .wp-slide-menu__back')) return;

            const backItem = document.createElement('li');
            backItem.className = 'wp-slide-menu__back';

            const backLink = document.createElement('a');
            backLink.href = '#';
            backLink.textContent = 'Back';

            backItem.appendChild(backLink);
            submenu.prepend(backItem);

        });

        updateHeight();

        // Handle menu clicks
        wrapper.addEventListener('click', function (event) {

            // Back button
            const backButton = event.target.closest('.wp-slide-menu__back a');

            if (backButton) {

                event.preventDefault();

                if (!history.length) return;

                currentPanel.classList.remove('is-active');

                const previousPanel = history.pop();

                currentPanel.classList.remove('is-before');

                currentPanel = previousPanel;

                currentPanel.classList.remove('is-before');
                currentPanel.classList.add('is-active');

                updateHeight();

                return;
            }

            // Parent menu link
            const link = event.target.closest('a');

            if (!link || !wrapper.contains(link)) return;

            const item = link.closest('li');

            if (!item) return;

            const submenu = item.querySelector(':scope > ul.sub-menu');

            // Allow normal navigation for menu items without children
            if (!submenu) return;

            event.preventDefault();

            // Save current panel
            history.push(currentPanel);

            // Slide current panel out
            currentPanel.classList.remove('is-active');
            currentPanel.classList.add('is-before');

            // Show next panel
            currentPanel = submenu;

            currentPanel.classList.remove('is-before');
            currentPanel.classList.add('is-active');

            updateHeight();

        });

    });

});
</script>
