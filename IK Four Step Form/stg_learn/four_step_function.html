<script>
  document.addEventListener("DOMContentLoaded", () => {
    const getGoal = document.querySelector('.gql_goal_select');
    const getWork = document.querySelector('.gql_work_select');
    const getAuthStatus = document.querySelector('.gql_auth_status_select');
        
      const webinarMapping = {
        "Land a top tech company role (FAANG/tier-1)": "Regular",
        "Switch roles to increase compensation (same domain, better pay)": "Switch_UP",
        "Transition into AI/ML/Agentic AI": "Switch_UP",
        "Land my first tech job (fresh grad/career starter)": "Regular",
        "Upskill in current role (no immediate job change)": "Agentic_AI",
      };
      
    //   United States
      window.isUSA = v_country === 'Bangladesh';
      const completeMessages = document.querySelectorAll(".complete_message");

      window.checkUsa = function(isUSA) {
      if (isUSA) {
        completeMessages.forEach(el => { el.setAttribute('show_status', false);});
        document.querySelectorAll('.v2_from_wrapper, .v2_from_wrapper_2').forEach(el => { el.setAttribute("active_step", 4);});
      } else {
        completeMessages.forEach(el => { el.setAttribute('show_status', true);});
      }
      }

      function handleFinalUI() {
        document.querySelectorAll(".pr_yr_exp").forEach(el => { el.setAttribute('show_status', false);});

        completeMessages.forEach(el => { el.setAttribute('show_status', true)});
      }

      function handleErrorUI() {
        completeMessages.forEach(el => { el.setAttribute('show_status', false); });
      }

      window.submitFourStepForm = async function ({
        formData = {},
        isPartner = false,
        sbFrEx = false,
        onSuccess = null,
        onError = null,
        
      } = {}) {

        try {
          if (!formData || Object.keys(formData).length === 0) {
            throw new Error("Payload empty");
          }

          const finalData = {
                'First Name': formData.firstName,
                'Last Name': formData.lastName,
                'Email Address': formData.email,
                utm_source: formData.utm_source,
                utm_medium: formData.utm_medium,
                utm_campaign: formData.utm_campaign,
                utm_term: formData.utm_term,
                gclid: formData.gclid,
                msclkid: formData.msclkid,
                "fbclid": formData.fbclid,
                "fbpId": formData.fbpId,
                "fbcId": formData.fbcId,
                "webinar-type": formData.webinar_type,
                user_id: visitor_id,
                user_timezone: v_timezone,
                v_country: v_country,
                "page_url": formData?.page_url,
                phone_number_full: formData.fPhoneNumber,
                phone_code: formData.phone_code,
                'Event Start Time': formData.eventStartTime,
                'Event End Time': formData.eventEndTime,
                'Work Experience': formData.WorkExperience,
                'Role Domain': formData.RoleDomain,
                'Interview Start Time': formData.InterviewStartTime,
                'Laid Off': formData.LaidOff,
                'Is Student': formData.IsStudent,
                salesforce_uuid: formData.salesforce_uuid,
                GA_event_id: Date.now(),
                "primary_goal": getGoal?.value || "",
                "technical_involvement": getWork?.value || "",
                "work_authorization_status": getAuthStatus?.value || "",
                "webinar-type": webinarMapping[getGoal?.value] || webinarType,
                ...(window.updateZapPayload || {}),
          };

          let zapUrl = isPartner ? getWebhook("3409hxu") : getWebhook("3409hxu");

          if (sbFrEx) {
            zapUrl = getWebhook("2q1a52r");
          }

          // Api send stop
            console.log("API Temporary disabled", finalData);
            handleFinalUI();
            return;

          const response = await fetch(zapUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(finalData)
          });

          if (!response.ok) throw new Error("Zap failed");

          handleFinalUI();

          if (typeof onSuccess === "function") onSuccess(response);

        } catch (err) {
          console.error(err);
          handleErrorUI();

          if (typeof onError === "function") onError(err);
        }
      };
  });
</script>
