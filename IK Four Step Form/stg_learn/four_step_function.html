<script>
  document.addEventListener("DOMContentLoaded", () => {

    window.stepFourForm = function(){
    return`
         <div class="from_step from_tep_4">
            <div class="tr_filds">
                    <label class="fr_fild v2_goal_fild" err_status="false">
                        <span class="title">What is your Current Goal?</span>
                        <select class="gql_goal_select">
                            <option value="" data-cr="0.35">Select option</option>
                            <option value="Land a top tech company role (FAANG/tier-1)" data-cr="0.58">Land a top tech company role (FAANG/tier-1)</option>
                            <option value="Switch roles to increase compensation (same domain, better pay)" data-cr="1.02">Switch roles to increase compensation (same domain, better pay)</option>
                            <option value="Transition into AI/ML/Agentic AI" data-cr="1.02">Transition into AI/ML/Agentic AI</option>
                            <option value="Transition into TPM/EM/Product Management" data-cr="1.59">Transition into TPM/EM/Product Management</option>
                            <option value="Land my first tech job (fresh grad/career starter)" data-cr="1.40">Land my first tech job (fresh grad/career starter)</option>
                            <option value="Re-enter after a career break" data-cr="1.19">Re-enter after a career break</option>
                            <option value="Upskill in current role (no immediate job change)" data-cr="1.19">Upskill in current role (no immediate job change)</option>
                            <option value="Just exploring / not decided yet" data-cr="1.19">Just exploring / not decided yet</option>
                        </select>
                        <span class="err_fild"><b>ⓘ</b> Select goal</span>
                    </label>
                </div>
  
                <label class="fr_fild v2_work_fild" err_status="false">
                    <span class="title">How would you describe your current involvement in technical work?</span>
                    <select class="gql_work_select">
                        <option value="" data-cr="0.37">Select option</option>
                        <option value="Hands-on — I code or build systems daily" data-cr="1.87">Hands-on — I code or build systems daily</option>
                        <option value="Technical lead — I design/architect but code less" data-cr="1.87">Technical lead — I design/architect but code less</option>
                        <option value="Tech manager — I manage engineers, limited coding" data-cr="1.87">Tech manager — I manage engineers, limited coding</option>
                        <option value="Non-technical manager — I oversee tech projects" data-cr="1.87">Non-technical manager — I oversee tech projects</option>
                        <option value="Formerly technical — Haven't been hands-on in 2+ years" data-cr="1.87">Formerly technical — Haven't been hands-on in 2+ years</option>
                        <option value="Not technical — I work outside engineering" data-cr="1.87">Not technical — I work outside engineering</option>
                    </select>
                    <span class="err_fild"><b>ⓘ</b> Select work involvement</span>
                </label>
                
                <label class="fr_fild v2_auth_status_fild" err_status="false">
                    <span class="title">What is your Work Authorization Status?</span>
                    <select class="gql_auth_status_select">
                        <option value="" data-cr="0.37">Select option</option>
                        <option value="US Citizen/ Green Card" data-cr="0.73">US Citizen/ Green Card</option>
                        <option value="H-1B/O-1" data-cr="1.27">H-1B/O-1</option>
                        <option value="L-1/F-1/OPT" data-cr="1.75">L-1/F-1/OPT</option>
                        <option value="Not currently authorized" data-cr="1.13">Not currently authorized</option>
                    </select>
                    <span class="err_fild"><b>ⓘ</b> Select work authorization status</span>
                  
                </label>
            <div class="btn_container">
                <button class="step_btn step_back step_back_4" id="v-two-form-fourth-back">Back</button>
                <button class="step_btn step_btn_4">Submit</button>
            </div>
            </div>
    </div>
    `;
        }
    
   
      const webinarMapping = {
        "Land a top tech company role (FAANG/tier-1)": "Regular",
        "Switch roles to increase compensation (same domain, better pay)": "Switch_UP",
        "Transition into AI/ML/Agentic AI": "Switch_UP",
        "Land my first tech job (fresh grad/career starter)": "Regular",
        "Upskill in current role (no immediate job change)": "Agentic_AI",
      };
      
    //   United States
      window.isUSA = v_country === 'Bangladesh';
      const completeMessages = document.querySelectorAll(".complete_message");

      window.checkUsa = function(isUSA) {
      if (isUSA) {
        completeMessages.forEach(el => { el.setAttribute('show_status', false);});
        document.querySelectorAll('.v2_from_wrapper, .v2_from_wrapper_2').forEach(el => { el.setAttribute("active_step", 4);});
      } else {
        completeMessages.forEach(el => { el.setAttribute('show_status', true);});
      }
      }

      function handleFinalUI() {
        document.querySelectorAll(".pr_yr_exp").forEach(el => { el.setAttribute('show_status', false);});

        completeMessages.forEach(el => { el.setAttribute('show_status', true)});
      }

      function handleErrorUI() {
        completeMessages.forEach(el => { el.setAttribute('show_status', false); });
      }

      window.submitFourStepForm = async function ({
        form = null,
        formData = {},
        isPartner = false,
        sbFrEx = false,
        onSuccess = null,
        onError = null,
        
      } = {}) {

        try {
        if (!form) throw new Error("Form not provided");

        const currentForm = form.closest('.v2_from_wrapper') || form.closest('.v2_from_wrapper_2')  || form;
        const getGoal = currentForm.querySelector('.gql_goal_select');
        const getWork = currentForm.querySelector('.gql_work_select');
        const getAuthStatus = currentForm.querySelector('.gql_auth_status_select');


          if (!formData || Object.keys(formData).length === 0) {
            throw new Error("Payload empty");
          }

          const finalData = {
                'First Name': formData.firstName,
                'Last Name': formData.lastName,
                'Email Address': formData.email,
                utm_source: formData.utm_source,
                utm_medium: formData.utm_medium,
                utm_campaign: formData.utm_campaign,
                utm_term: formData.utm_term,
                gclid: formData.gclid,
                msclkid: formData.msclkid,
                "fbclid": formData.fbclid,
                "fbpId": formData.fbpId,
                "fbcId": formData.fbcId,
                "webinar-type": formData.webinar_type,
                user_id: visitor_id,
                user_timezone: v_timezone,
                v_country: v_country,
                "page_url": formData?.page_url,
                phone_number_full: formData.fPhoneNumber,
                phone_code: formData.phone_code,
                'Event Start Time': formData.eventStartTime,
                'Event End Time': formData.eventEndTime,
                'Work Experience': formData.WorkExperience,
                'Role Domain': formData.RoleDomain,
                'Interview Start Time': formData.InterviewStartTime,
                'Laid Off': formData.LaidOff,
                'Is Student': formData.IsStudent,
                salesforce_uuid: formData.salesforce_uuid,
                GA_event_id: Date.now(),
                "primary_goal": getGoal?.value || "",
                "technical_involvement": getWork?.value || "",
                "work_authorization_status": getAuthStatus?.value || "",
                "webinar-type": webinarMapping[getGoal?.value] || webinarType,
                ...(window.updateZapPayload || {}),
          };

          let zapUrl = isPartner ? getWebhook("3409hxu") : getWebhook("3409hxu");

          if (sbFrEx) {
            zapUrl = getWebhook("2q1a52r");
          }

          // Api send stop
            console.log("API Temporary disabled", finalData);
            handleFinalUI();
            return;

          const response = await fetch(zapUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(finalData)
          });

          if (!response.ok) throw new Error("Zap failed");

          handleFinalUI();

          if (typeof onSuccess === "function") onSuccess(response);

        } catch (err) {
          console.error(err);
          handleErrorUI();

          if (typeof onError === "function") onError(err);
        }
      };
  });
</script>
