<style>
.prevor-check-dropdown { position: relative; width: 100%; }

.prevor-dropdown-toggle {
    width: 100%;
    padding: 12px 15px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    color: #000;
}
.prevor-dropdown-toggle::after { content: "▾"; float: right; }

.prevor-dropdown-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 250px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    z-index: 9999;
    padding: 8px 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
}
.prevor-check-dropdown.is-open .prevor-dropdown-panel { display: block; }

.prevor-checkbox-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
}
.prevor-checkbox-option:hover { background: #f3f6f8; }
.prevor-checkbox-option input { margin: 0; cursor: pointer; }

.prevor-no-options { padding: 8px 12px; margin: 0; font-size: 13px; }

.prevor-no-products { grid-column: 1 / -1; padding: 20px 0; text-align: center; }
.prevor-product-grid.is-loading .elementor-loop-container { opacity: .4; pointer-events: none; transition: opacity .2s; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const categoryWidget = document.querySelector('.category_filter');
    const bodyPartWidget = document.querySelector('.tax-select-filter');
    const grid = document.querySelector('.prevor-product-grid, .elementor-element-86b27dd');

    if (!categoryWidget || !bodyPartWidget || !grid) {
        console.warn('Prevor filters: required widgets not found.');
        return;
    }

    // Prevent double initialisation.
    if (categoryWidget.querySelector('.prevor-check-dropdown')) return;

    const categoryFilter = categoryWidget.querySelector('.e-filter');
    const bodyPartFilter = bodyPartWidget.querySelector('.e-filter');
    if (!categoryFilter || !bodyPartFilter) return;

    // Hide Elementor's own filter - we only read its terms, never click it.
    categoryFilter.style.display = 'none';
    bodyPartFilter.style.display = 'none';

    const config = window.prevorFilterData;
    if (!config || !config.ajaxUrl) {
        console.warn('Prevor filters: prevorFilterData missing.');
        return;
    }

    function getTerms(filter) {
        return Array.from(filter.querySelectorAll('button[data-filter]'))
            .filter(b => b.dataset.filter && b.dataset.filter !== '__all')
            .map(b => ({ slug: b.dataset.filter, name: b.textContent.trim() }));
    }

    const state = {
        categories: [],
        bodyParts: []
    };

    function createDropdown(widget, title, stateKey, terms) {

        const wrapper = document.createElement('div');
        wrapper.className = 'prevor-check-dropdown';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'prevor-dropdown-toggle';
        toggle.textContent = title;

        const panel = document.createElement('div');
        panel.className = 'prevor-dropdown-panel';

        wrapper.append(toggle, panel);
        widget.insertBefore(wrapper, widget.firstChild);

        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            const willOpen = !wrapper.classList.contains('is-open');
            document.querySelectorAll('.prevor-check-dropdown.is-open')
                .forEach(d => d.classList.remove('is-open'));
            wrapper.classList.toggle('is-open', willOpen);
        });

        // Clicking inside the panel must not close it.
        panel.addEventListener('click', e => e.stopPropagation());

        if (!terms.length) {
            const empty = document.createElement('p');
            empty.className = 'prevor-no-options';
            empty.textContent = 'No options available';
            panel.appendChild(empty);
        }

        terms.forEach(function (term) {
            const label = document.createElement('label');
            label.className = 'prevor-checkbox-option';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = term.slug;

            const text = document.createElement('span');
            text.textContent = term.name;

            checkbox.addEventListener('change', function () {
                // Always read the CURRENT state (fixes stale-closure bug).
                const list = state[stateKey];
                const index = list.indexOf(term.slug);

                if (checkbox.checked && index === -1) list.push(term.slug);
                if (!checkbox.checked && index !== -1) list.splice(index, 1);

                toggle.textContent = list.length
                    ? list.length + ' selected'
                    : title;

                loadProducts();
            });

            label.append(checkbox, text);
            panel.appendChild(label);
        });
    }

    createDropdown(categoryWidget, 'Select Chemical Categories', 'categories', getTerms(categoryFilter));
    createDropdown(bodyPartWidget, 'Select Body Parts', 'bodyParts', getTerms(bodyPartFilter));

    // Close dropdowns when clicking outside.
    document.addEventListener('click', function () {
        document.querySelectorAll('.prevor-check-dropdown.is-open')
            .forEach(d => d.classList.remove('is-open'));
    });

    // ---------- AJAX ----------
    let controller = null;

    function loadProducts() {

        const container = grid.querySelector('.elementor-loop-container');
        if (!container) return;

        // Cancel any in-flight request so old responses can't overwrite new ones.
        if (controller) controller.abort();
        controller = new AbortController();

        const body = new URLSearchParams();
        body.append('action', 'prevor_filter_products');
        state.categories.forEach(slug => body.append('categories[]', slug));
        state.bodyParts.forEach(slug => body.append('body_parts[]', slug));

        grid.classList.add('is-loading');

        fetch(config.ajaxUrl, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: body.toString(),
            signal: controller.signal
        })
        .then(r => r.json())
        .then(function (response) {
            if (!response || !response.success) throw new Error('Filter request failed');
            container.innerHTML = response.data.html;
            grid.classList.remove('is-loading');
        })
        .catch(function (err) {
            if (err.name === 'AbortError') return;
            console.error('Prevor filters:', err);
            grid.classList.remove('is-loading');
        });
    }

});
</script>
