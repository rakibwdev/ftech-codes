<style>
.prevor-check-dropdown {
    position: relative;
    width: 100%;
}

.prevor-dropdown-toggle {
    width: 100%;
    padding: 12px 15px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.prevor-dropdown-toggle::after {
    content: "▾";
    float: right;
}

.prevor-dropdown-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 250px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    z-index: 9999;
    padding: 8px 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

.prevor-check-dropdown.is-open .prevor-dropdown-panel {
    display: block;
}

.prevor-checkbox-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
}

.prevor-checkbox-option:hover {
    background: #f3f6f8;
}

.prevor-checkbox-option input {
    margin: 0;
    cursor: pointer;
}

.prevor-no-options {
    padding: 8px 12px;
    margin: 0;
    font-size: 13px;
}

</style>


<script>

document.addEventListener('DOMContentLoaded', function () {

    const categoryWidget = document.querySelector('.category_filter');
    const bodyPartWidget = document.querySelector('.tax-select-filter');

    const grid = document.querySelector(
        '.elementor-element-86b27dd, .prevor-product-grid'
    );

    if (!categoryWidget || !bodyPartWidget || !grid) {
        console.warn('Prevor filters: Required widgets not found.');
        return;
    }

    const categoryFilter = categoryWidget.querySelector('.e-filter');
    const bodyPartFilter = bodyPartWidget.querySelector('.e-filter');

    if (!categoryFilter || !bodyPartFilter) return;

    // Hide original Elementor buttons.
    categoryFilter.style.display = 'none';
    bodyPartFilter.style.display = 'none';

    // Get original taxonomy terms.
    function getTerms(filter) {
        return Array.from(
            filter.querySelectorAll('button[data-filter]')
        )
        .filter(button =>
            button.dataset.filter &&
            button.dataset.filter !== '__all'
        )
        .map(button => ({
            slug: button.dataset.filter,
            name: button.textContent.trim()
        }));
    }

    const allCategories = getTerms(categoryFilter);
    const allBodyParts = getTerms(bodyPartFilter);

    let selectedCategories = [];
    let selectedBodyParts = [];

    // Create checkbox dropdown.
    function createDropdown(widget, id, title) {

        const wrapper = document.createElement('div');
        wrapper.className = 'prevor-check-dropdown';
        wrapper.id = id;

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'prevor-dropdown-toggle';
        toggle.textContent = title;

        const panel = document.createElement('div');
        panel.className = 'prevor-dropdown-panel';

        wrapper.appendChild(toggle);
        wrapper.appendChild(panel);

        widget.insertBefore(wrapper, widget.firstChild);

        toggle.addEventListener('click', function () {
            wrapper.classList.toggle('is-open');
        });

        return {
            wrapper,
            toggle,
            panel
        };
    }

    const categoryUI = createDropdown(
        categoryWidget,
        'prevor-category-dropdown',
        'Select Chemical Categories'
    );

    const bodyPartUI = createDropdown(
        bodyPartWidget,
        'prevor-bodypart-dropdown',
        'Select Body Parts'
    );

    // Close dropdown when clicking outside.
    document.addEventListener('click', function (event) {

        document.querySelectorAll('.prevor-check-dropdown.is-open')
            .forEach(function (dropdown) {

                if (!dropdown.contains(event.target)) {
                    dropdown.classList.remove('is-open');
                }

            });

    });

    // Update dropdown label.
    function updateDropdownLabel(ui, selected, defaultText) {

        if (!selected.length) {
            ui.toggle.textContent = defaultText;
            return;
        }

        ui.toggle.textContent = selected.length + ' selected';
    }

    // Render checkbox options.
    function renderOptions(ui, terms, selectedValues, onChange) {

        ui.panel.innerHTML = '';

        if (!terms.length) {

            const empty = document.createElement('p');
            empty.className = 'prevor-no-options';
            empty.textContent = 'No options available';

            ui.panel.appendChild(empty);

            return;
        }

        terms.forEach(function (term) {

            const label = document.createElement('label');
            label.className = 'prevor-checkbox-option';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = term.slug;
            checkbox.checked = selectedValues.includes(term.slug);

            const text = document.createElement('span');
            text.textContent = term.name;

            checkbox.addEventListener('change', function () {

                let selected = selectedValues.slice();

                if (checkbox.checked) {

                    if (!selected.includes(term.slug)) {
                        selected.push(term.slug);
                    }

                } else {

                    selected = selected.filter(
                        value => value !== term.slug
                    );

                }

                onChange(selected);

            });

            label.appendChild(checkbox);
            label.appendChild(text);

            ui.panel.appendChild(label);

        });

    }

    // Synchronize selected options with Elementor.
    function syncElementorFilter(filter, selectedValues) {

        const selected = new Set(selectedValues);

        filter.querySelectorAll('button[data-filter]').forEach(function (button) {

            const value = button.dataset.filter;

            if (!value || value === '__all') return;

            const shouldSelect = selected.has(value);

            const isSelected =
                button.getAttribute('aria-pressed') === 'true';

            if (shouldSelect !== isSelected) {
                button.click();
            }

        });

        // Reset Elementor filter when no option is selected.
        if (selectedValues.length === 0) {

            const allButton = filter.querySelector(
                'button[data-filter="__all"]'
            );

            if (
                allButton &&
                allButton.getAttribute('aria-pressed') !== 'true'
            ) {
                allButton.click();
            }

        }

    }

    // Render Chemical Categories.
    function renderCategories() {

        renderOptions(
            categoryUI,
            allCategories,
            selectedCategories,
            function (selected) {

                selectedCategories = selected;

                updateDropdownLabel(
                    categoryUI,
                    selectedCategories,
                    'Select Chemical Categories'
                );

                syncElementorFilter(
                    categoryFilter,
                    selectedCategories
                );

                // Keep ALL Body Part options visible.
                updateBodyParts();

            }
        );

    }

    // Always render ALL Body Part options.
    function updateBodyParts() {

        renderBodyParts(allBodyParts);

    }

    // Render Body Parts.
    function renderBodyParts(terms) {

        renderOptions(
            bodyPartUI,
            terms,
            selectedBodyParts,
            function (selected) {

                selectedBodyParts = selected;

                updateDropdownLabel(
                    bodyPartUI,
                    selectedBodyParts,
                    'Select Body Parts'
                );

                syncElementorFilter(
                    bodyPartFilter,
                    selectedBodyParts
                );

            }
        );

        updateDropdownLabel(
            bodyPartUI,
            selectedBodyParts,
            'Select Body Parts'
        );

    }

    // Initial rendering.
    renderCategories();
    updateBodyParts();

});

</script>
