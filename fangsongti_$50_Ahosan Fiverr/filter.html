
<style>
    .pdf-document-group {
    margin-bottom: 36px;
}

.pdf-document-status-heading {
    margin: 0 0 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #075bd8;
    color: #243746;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.4;
}

.pdf-document-group .pdf-document-grid {
    margin-top: 0;
}
    .pdf_fiter_head {
    display: flex;

}

.pdf-filter-status {
    margin: 0;
}

.pdf-filter-status-heading {
    margin: 0 0 20px;
    padding: 0 0 10px;
    border-bottom: 1px solid #075bd8;
    color: #243746;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.4;
}

.pdf-filter-sort-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    background: #fff;
    color: #243746;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

/* .pdf-filter-sort-btn.is-active */

.pdf-filter-sort-btn:hover {
    background: #243746;
}

/* Main filter wrapper */
.pdf-document-library {
    --pdf-filter-accent: #2872E3;
    --pdf-filter-border: #2872E3;
    --pdf-filter-text: #243746;

    width: 100%;
    color: var(--pdf-filter-text);
    font-family: inherit;
}

/* Filter tabs */
.pdf-filter-tabs {
    display: flex;
    align-items: stretch;
    gap: 8px;
}

.pdf-filter-tab {
    appearance: none;
    border-bottom: 0;
    padding: 13px 22px;
    background: #f5f8fa;
    color: var(--pdf-filter-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    border: none;
}

.pdf-filter-tab:hover,
.pdf-filter-tab.is-active {
    background: var(--pdf-filter-accent);
    border-color: var(--pdf-filter-accent);
    color: #fff;
}

/* Checkbox panels */
.pdf-filter-panel {
    padding: 4px 0 18px;
}

.pdf-filter-panel[hidden] {
    display: none !important;
}

.pdf-filter-options {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px 24px;
}

.pdf-filter-option {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: var(--pdf-filter-text);
    font-size: 15px;
    line-height: 1.5;
    cursor: pointer;
}

.pdf-filter-option input[type="checkbox"] {
    flex: 0 0 17px;
    width: 17px;
    height: 17px;
    margin: 0;
    accent-color: var(--pdf-filter-accent);
    cursor: pointer;
}

.pdf-filter-option span {
    overflow-wrap: anywhere;
}


.pdf-filter-sort {
    min-width: 100px;
    padding: 9px 12px;
    border: 1px solid var(--pdf-filter-border);
    border-radius: 5px;
    background: #fff;
    color: var(--pdf-filter-text);
    font: inherit;
}


/* Filter status and empty messages */
.pdf-filter-status {
    margin-bottom: 14px;
    font-size: 13px;
    color: #64748b;
}

.pdf-filter-empty,
.pdf-filter-no-results {
    padding: 18px 0;
    color: #64748b;
}

/* PDF document grid */
.pdf-document-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 30px;
}

/* Individual document card */
.pdf-document-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    min-width: 0;
    padding: 0;
    border: 0;
    transition: box-shadow 0.2s ease;
}

.pdf-document-card:hover {
    box-shadow: 0 5px 18px rgb(8 50 78 / 7%);
}

/* PDF preview container */
.pdf-document-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    padding: 7px;
    border: 1px solid var(--pdf-filter-border);
    background: #fff;
    box-sizing: border-box;
}

/* PDF featured image */
.pdf-document-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

/* Document title */
.pdf-document-title {
    margin: 0;
    color: var(--pdf-filter-text) !important;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
    overflow-wrap: anywhere;
}

/* Blue download ribbon */
.pdf-document-download {
    position: absolute;
    right: -20px;
    bottom: -12px;
    z-index: 2;
}

/* Download icon */
.pdf-document-download img,
.pdf-download-icon {
    display: block;
    width: 77px;
    object-fit: contain;
    margin-left: 10px;
}

/* Loading state */
.pdf-document-library [aria-busy="true"] {
    opacity: 0.65;
}

/* Tablet */
@media (max-width: 1024px) {
    .pdf-document-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .pdf-filter-options {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

/* Mobile */
@media (max-width: 767px) {
    .pdf-filter-tabs {
        gap: 5px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--pdf-filter-border);
    }

    .pdf-filter-tab {
        flex: 1;
        padding: 11px 8px;
        font-size: 14px;
    }

    .pdf-filter-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .pdf-document-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 14px;
    }

}
</style>



<script>
(function () {
    'use strict';

    function initPdfLibrary(root) {
        if (root.dataset.initialized === 'true') return;
        root.dataset.initialized = 'true';

        const ajaxUrl = root.dataset.ajaxUrl;
        const nonce = root.dataset.nonce;
        const storageKey = 'pdf-library-state:' + location.pathname;

        const tabs = root.querySelectorAll('.pdf-filter-tab');
        const panels = root.querySelectorAll('.pdf-filter-panel');
        const checkboxes = root.querySelectorAll('.pdf-filter-checkbox');
        const sortButtons = root.querySelectorAll('.pdf-filter-sort-btn');
        const results = root.querySelector('.pdf-filter-results');
        const status = root.querySelector('.pdf-filter-status');
        

        let requestController = null;
        let requestNumber = 0;
        let debounceTimer = null;
        let sortOrder = 'asc';

        function readState() {
            try {
                return JSON.parse(localStorage.getItem(storageKey)) || {};
            } catch (error) {
                return {};
            }
        }

        localStorage.removeItem(storageKey);

        function saveState() {
            const state = {
                fileIds: Array.from(
                    root.querySelectorAll('[data-group="file"]:checked')
                ).map(input => input.value),

                productIds: Array.from(
                    root.querySelectorAll('[data-group="product"]:checked')
                ).map(input => input.value),

                // sort: sortSelect.value
            };

            try {
                localStorage.setItem(storageKey, JSON.stringify(state));
            } catch (error) {
                // Filtering still works if storage is unavailable.
            }
        }

        sortButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                sortButtons.forEach(function (btn) {
                    btn.classList.remove('is-active');
                });

                button.classList.add('is-active');
                sortOrder = button.dataset.sort;

                saveState();
                fetchDocuments();
            });
        });


        function restoreState() {
            const state = readState();

            checkboxes.forEach(input => {
                const savedIds = input.dataset.group === 'file'
                    ? state.fileIds
                    : state.productIds;

                input.checked = Array.isArray(savedIds) &&
                    savedIds.includes(input.value);
            });

        }

        function switchTab(name) {
            tabs.forEach(tab => {
                const active = tab.dataset.tab === name;
                tab.classList.toggle('is-active', active);
                tab.setAttribute('aria-selected', String(active));
            });

            panels.forEach(panel => {
                const active = panel.dataset.panel === name;
                panel.classList.toggle('is-active', active);
                panel.hidden = !active;
            });
        }

        async function fetchDocuments() {
            const currentRequest = ++requestNumber;

            if (requestController) {
                requestController.abort();
            }

            requestController = new AbortController();

            const fileIds = Array.from(
                root.querySelectorAll('[data-group="file"]:checked')
            ).map(input => input.value);

            const productIds = Array.from(
                root.querySelectorAll('[data-group="product"]:checked')
            ).map(input => input.value);

            const data = new FormData();
            data.append('action', 'rakib_filter_pdf_documents');
            data.append('nonce', nonce);
            data.append('sort', sortOrder);

            fileIds.forEach(id => data.append('file_ids[]', id));
            productIds.forEach(id => data.append('product_ids[]', id));

            results.setAttribute('aria-busy', 'true');
            // status.textContent = 'Loading documents…';

            try {
                const response = await fetch(ajaxUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: data,
                    signal: requestController.signal
                });

                const json = await response.json();

                if (currentRequest !== requestNumber) return;

                if (!response.ok || !json.success) {
                    throw new Error(
                        json.data && json.data.message
                            ? json.data.message
                            : 'Unable to load documents.'
                    );
                }

                results.innerHTML = json.data.html;
            } catch (error) {
                if (error.name === 'AbortError') return;

                if (currentRequest === requestNumber) {
                    results.textContent = 'Could not load documents. Please try again.';
                }
            } finally {
                if (currentRequest === requestNumber) {
                    results.removeAttribute('aria-busy');
                }
            }
        }

        function scheduleUpdate() {
            saveState();
            window.clearTimeout(debounceTimer);
            debounceTimer = window.setTimeout(fetchDocuments, 180);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.tab);
            });
        });

        checkboxes.forEach(input => {
            input.addEventListener('change',function (){
                scheduleUpdate();
            });
        });

        restoreState();
        switchTab('file');
        fetchDocuments();
    }

    function startPdfLibraries() {
        document.querySelectorAll('.pdf-document-library').forEach(initPdfLibrary);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startPdfLibraries);
    } else {
        startPdfLibraries();
    }
})();
</script>
