<script>
document.addEventListener("DOMContentLoaded", function () {

    const header = document.querySelector(".sticky-header");

    if (!header) return;

    window.addEventListener("scroll", function () {
        if (window.scrollY > 50) {
            header.classList.add("header-scrolled");
        } else {
            header.classList.remove("header-scrolled");
        }
    });

});
</script>

<style>
    /* Header */
  .sticky-header{
    transition: all .3s ease;
    backdrop-filter: blur(5px) !important;
    width: 100% !important;
  }
  
  .header-logo img{
    transition: all .35s ease;
  }
  
  .sticky-header.header-scrolled{
    min-height: 70px !important;
  }
  
  .sticky-header.header-scrolled .header-logo img{
    width: 140px !important;
  }


  /* Menu last element */

  selector .elementor-nav-menu--main ul > li:last-child {
    border: 1px solid white;
    padding: 0 12px;
    transition: all 0.3s ease;
}

selector .elementor-nav-menu--main ul > li:last-child:hover {
    border:1px solid #C8B38E;
    scale: 1.02;

}
</style>
