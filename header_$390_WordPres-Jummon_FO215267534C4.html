<!-- Floating List -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll('.elementor-icon-list-items').forEach(function (list) {

        const items = Array.from(list.querySelectorAll('.elementor-icon-list-item'));

        if (items.length <= 1) return;

        let currentIndex = 0;

        items.forEach((item, index) => {
            item.classList.toggle('is-active', index === currentIndex);
        });

        function showRandomItem() {

            let nextIndex;

            do {
                nextIndex = Math.floor(Math.random() * items.length);
            } while (nextIndex === currentIndex);

            const currentItem = items[currentIndex];
            const nextItem = items[nextIndex];

            currentItem.classList.remove('is-active');
            currentItem.classList.add('is-exiting');

            nextItem.classList.remove('is-exiting');
            nextItem.classList.add('is-active');

            setTimeout(() => {
                currentItem.classList.remove('is-exiting');
            }, 500);

            currentIndex = nextIndex;
        }

        setInterval(showRandomItem, 3000);

    });

});
</script>


<!-- Mobile Menu -->
<script>
    const existingMenu = document.querySelector(
    '.elementor-nav-menu--dropdown .elementor-nav-menu'
);
const target = document.querySelector('.your-target');

function buildMenu(source) {
    const ul = document.createElement('ul');

    source.querySelectorAll(':scope > li').forEach(item => {

        const li = document.createElement('li');

        // Get direct link
        const link = item.querySelector(':scope > a');
        if (!link) return;

        // Create link
        const a = document.createElement('a');
        a.href = link.href;
        a.textContent = link.textContent;
        li.appendChild(a);

        // Get direct submenu
        const submenu = item.querySelector(':scope > .sub-menu');

        if (submenu) {

            // Create sidebar panel
            const panel = document.createElement('div');
            panel.className = 'sidebar_panel';

            // Create header
            const header = document.createElement('div');
            header.className = 'sidebar_header';

            // Back button
            const backBtn = document.createElement('button');
            backBtn.className = 'return-btn';

            // Back SVG icon
            const backIcon = document.createElement('img');
            backIcon.src = 'https://staging.rodeovault.com/wp-content/uploads/2026/09/arrow-prev-svgrepo-com.svg';
            backIcon.alt = 'Back';

            backBtn.appendChild(backIcon);
					
					// Title
            const title = document.createElement('h3');
            title.textContent = link.textContent;

            // Close button
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';

            // Times icon
            closeBtn.innerHTML = '&times;';

            // Header structure
            header.appendChild(backBtn);
            header.appendChild(title);
            header.appendChild(closeBtn);

            // Build submenu recursively
            const subMenu = buildMenu(submenu);

            subMenu.classList.add('sub-menu');

            // Panel structure
            panel.appendChild(header);
            panel.appendChild(subMenu);

            // Add panel inside current LI
            li.appendChild(panel);
        }

        ul.appendChild(li);
    });

    return ul;
}


function initSidebarMenu(menu) {

    // Menu item click
    menu.querySelectorAll('li').forEach(item => {

        const link = item.querySelector(':scope > a');
        const panel = item.querySelector(':scope > .sidebar_panel');

        // Only items that have a sidebar panel
        if (link && panel) {

            link.addEventListener('click', function (e) {

                e.preventDefault();

                panel.style.left = '0';
            });
        }
    });


    // Back button click
    menu.querySelectorAll('.return-btn').forEach(button => {

        button.addEventListener('click', function (e) {

            e.preventDefault();

            const panel = button.closest('.sidebar_panel');

            if (panel) {
                panel.style.left = '100%';
            }
        });
    });


    // Close button
    menu.querySelectorAll('.close-btn').forEach(button => {

        button.addEventListener('click', function (e) {

            e.preventDefault();

            const panel = button.closest('.sidebar_panel');

            if (panel) {
                panel.style.left = '100%';
            }
        });
    });
}


// Build new menu
	if (existingMenu && target) {
		const newMenu = buildMenu(existingMenu);

    target.appendChild(newMenu);
    initSidebarMenu(newMenu);
}
</script>
