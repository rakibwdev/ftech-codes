<style>

.course-learning-wrapper {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
    background: #05090b;
    color: #fff;
    padding: 20px;
}

   /* VIDEO */


.course-video-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1d2529;
}

.course-video {
    width: 100%;
    height: 100%;
}

.course-video iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
}

.course-video-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
}



   /* LESSON INFORMATION */


.course-lesson-info {
    padding-top: 25px;
}

.course-current-module {
    color: #fff;
    font-size: 13px;
    margin-bottom: 10px;
}

.course-lesson-info h1 {
    font-size: 32px;
    margin: 0 0 15px;
    color: #fff;
}

.course-lesson-info p {
    color: #999;
    line-height: 1.7;
}



   /* SIDEBAR */


.course-sidebar {
    border-radius: 10px;
    overflow: hidden;
}

.course-sidebar-title {
    font-size: 13px;
    letter-spacing: .5px;
    padding: 18px;
    border-bottom: 1px solid #1d2529;
    color: #fff;
}



   /* MODULE */

.course-module {
    position: relative;
    border-bottom: 1px solid #1d2529;
    background-size: cover;
    background-position: center;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
}

.course-module::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient( to bottom,  #0b4e2526,#000000bf);
    pointer-events:none;
    backdrop-filter:blur(1px);

}

.course-module > * {
    position: relative;
    z-index: 2;
}

.course-module-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    cursor: pointer;
}

.course-module-header:hover {
    background: #203c2e3b;
    backdrop-filter: blur(2px);
}

.module-number {
    width: 30px;
    height: 30px;
    border: 1px solid #315b37;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7ee787;
    flex-shrink: 0;
}

.module-info {
    flex: 1;
}

.module-info h3 {
    margin: 0 0 5px;
    font-size: 14px;
    color: #fff;
}

.module-info span {
    font-size: 11px;
    color: #fff;
}

.module-arrow {
    font-size: 28px;
    color: #fff;
    transition: transform .3s ease;
}


   /* OPEN MODULE */


.course-module.active .module-arrow {
    transform: rotate(45deg);
}

.course-lessons {
    max-height: 0 ;
    overflow: hidden;
    opacity: 0;
    transition: all 0.5s ease;
}

.course-module.active .course-lessons{
    max-height: 500px;
    opacity: 1;
}


   /* LESSON */

.course-lesson {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .2s ease;
}

.course-lesson:hover {
    background-image: linear-gradient(135deg, #00793d40 0%, #0000008c 100%);
    backdrop-filter: blur(3px);
    border-radius:6px 0 0 6px;
}
.course-lesson.active {
    background-image: linear-gradient(135deg, #00793d40 0%, #0000008c 100%);
    backdrop-filter: blur(3px);
    border-radius:6px 0 0 6px;
    border-left-color: #00a453;
}

.lesson-icon {
    width: 20px;
    text-align: center;
    font-size: 12px;
    color: #fff;
}

.course-lesson.active .lesson-icon {
    color: #7ee787;
}

.lesson-name {
    flex: 1;
    font-size: 12px;
    color: #fff;
}

.course-lesson.active .lesson-name {
    color: #fff;
}

.lesson-duration {
    font-size: 10px;
    color: #fff;
}



   /* MOBILE */


@media (max-width: 900px) {

    .course-learning-wrapper {
        grid-template-columns: 1fr;
    }

    .course-sidebar {
        width: 100%;
    }

}
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {

    const currentUrl = window.location.pathname;
    const menuItems = document.querySelectorAll(".dashboard-menu");

    menuItems.forEach(function (item) {

        const itemUrl = new URL(item.href).pathname;

        if (currentUrl === itemUrl) {
            item.classList.add("active");
        }

    });

});
</script>


<style>
    .dashboard-menu.active {
    background-color: #0f3824;
    backdrop-filter: blur(5px);
    box-shadow: 0 0 6px 0.05px #00f46594; 
}
</style>



<style>
selector ul li {
    background-color: #ffffff0f;
    box-shadow: 0 0 6px 0.5px #ffffff8a inset;
    border-radius: 8px;
    padding: 8px 16px;
    margin-bottom: 20px;
    transition: transform 0.3s ease;
}

selector ul li:hover {
    transform: translateY(-3px);
    background-color: #00e6760f;
    box-shadow: 0 0 6px 0.5px #00e6768a inset;
}


/* sidebar */

selector{
    .elementor-icon-box-wrapper{
        align-items: center !important;
    }
    .elementor-icon-box-title{
        margin: 0;
    }
}

selector{
    min-width: 300px;
}

</style>



<!-- Text animation -->

<script>
    document.addEventListener("DOMContentLoaded", function () {

    const buttons = document.querySelectorAll(
        ".elementor-button-text"
    );

    buttons.forEach(function (button) {

        const text = button.textContent.trim();

        button.innerHTML = "";

        [...text].forEach(function (char, index) {

            const span = document.createElement("span");

            span.textContent = char === " " ? "\u00A0" : char;

            span.style.setProperty("--i", index);

            button.appendChild(span);

        });

    });

});
</script>

<style>

.elementor-button {
    transition:
        transform 0.4s cubic-bezier(.22, 1, .36, 1),
        background-color 0.3s ease,
        color 0.3s ease;
}


.elementor-button:hover {
    transform: scale(1.03);
}

/* text */
.elementor-button-text {
    transition: color 0.3s ease;
}

/* corner */

 .elementor-button::before,
 .elementor-button::after {
    content: "";
    position: absolute;

    width: 20px;
    height: 22px;

    pointer-events: none;

    transition:
        transform 0.45s cubic-bezier(.22, 1, .36, 1),
        opacity 0.3s ease;
}


/* Top-left corner */
 .elementor-button::before {
    top: -5px;
    left: -5px;

    border-top: 1px solid rgba(255,255,255,.5);
    border-left: 1px solid rgba(255,255,255,.5);

    transform: translate(-5px, -5px);
}


/* Bottom-right corner */
 .elementor-button::after {
    right: -5px;
    bottom: -5px;

    border-right: 1px solid rgba(255,255,255,.5);
    border-bottom: 1px solid rgba(255,255,255,.5);

    transform: translate(5px, 5px);
}


/* Hover corners */
 .elementor-button:hover::before {
    transform: translate(0, 0);
}

 .elementor-button:hover::after {
    transform: translate(0, 0);
}

/* LETTER CASCADE */

 .elementor-button-text span {
    display: inline-block;

    transform: translateX(0px);
    opacity: 1;

    transition-delay: calc(var(--i) * 0.025s);
}


/* Hover animation */
 .elementor-button:hover
.elementor-button-text span {

    transform: translateX(3px);
  
  padding-left: calc(var(--padding) - 5px);
    transition-delay: calc(var(--i) * 0.025s);
}

</style>


<!-- dropdown -->

<script>
    document.querySelector(".tools").addEventListener("click", function () {
    document.querySelectorAll(".sub-tools, .tools").forEach(el => el.classList.toggle("active"));});
</script>

<style>

.sub-tools {
    max-height: 0 ;
    overflow: hidden;
    opacity: 0;
    padding: 0 15px;
    transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
}

.sub-tools.active {
    max-height: 500px;
    opacity: 1;
    padding: 15px;
}


.tools.active .elementor-element-3a6539f {
    transform: rotate(-180deg);
}
</style>
