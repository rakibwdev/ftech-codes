<script>
function updateDateTime() {
    const now = new Date();

    const options = {
        month: 'short',
        day: '2-digit',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    document.getElementById('live-datetime').textContent =
        now.toLocaleString('en-US', options);
}

updateDateTime();
setInterval(updateDateTime, 1000);



// Menu Click
document.querySelectorAll('.menu').forEach(function(menu) {
    menu.addEventListener('click', function(event) {
        event.preventDefault();

        document.querySelectorAll('.menu').forEach(function(item) {
            if (item !== menu) {
                item.classList.remove('active');
            }
        });

        menu.classList.toggle('active');
    });
});

</script>

<!-- randomize -->

<script>
document.addEventListener('DOMContentLoaded', function () {

    const roundInput = document.getElementById('e-form-round');
    const randomizationInput = document.getElementById('e-form-randomization');

    const submitButton = document.getElementById('submit-button');
    const nextRoundButton = document.getElementById('next-round');
    const finalRoundButton = document.getElementById('final-round');
    const newGiveawayButton = document.getElementById('new_giveway_form_button');
    const clearButton = document.getElementById('clear-button');
    const roundCountElement = document.querySelector('.round_count');
    const leftRoundElement = document.querySelector('.left_round');
    const roundLoader = document.querySelector('.round-loader');

    if (!roundInput || !randomizationInput || !submitButton) {
        return;
    }

    let participants = [];
    let currentRound = 0;
    let totalRounds = 0;

function updateRoundInfo() {

    if (roundCountElement) {
        roundCountElement.textContent = 'Result of Round # ' + currentRound;
    }

    if (leftRoundElement) {

        const leftRounds = Math.max(
            totalRounds - currentRound,
            0
        );

        if (leftRounds === 0) {
            leftRoundElement.textContent = 'Completed!';
        } else if (leftRounds === 1) {
            leftRoundElement.textContent = '1 round left';
        } else {
            leftRoundElement.textContent = leftRounds + ' rounds left';
        }
    }
}

function showRoundLoader() {

    if (roundLoader) {
        roundLoader.style.display = 'flex';
    }

    if (randomizationInput) {
        randomizationInput.value = '';
        randomizationInput.placeholder = '';
    }
}

function hideRoundLoader() {

    if (roundLoader) {
        roundLoader.style.display = 'none';
    }
}

function waitForRoundLoader() {

    return new Promise(function (resolve) {

        showRoundLoader();

        setTimeout(function () {

            hideRoundLoader();

            resolve();

        }, 500);

    });
}

    if (nextRoundButton) {
        nextRoundButton.style.display = 'none';
    }

    if (finalRoundButton) {
        finalRoundButton.style.display = 'none';
    }
     if(newGiveawayButton){
        newGiveawayButton.style.display = 'none';
    }

    function shuffle(array) {
        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
    }

    function showResult(names) {
        let output = '';

        names.forEach(function (name, index) {
            output += (index + 1) + '. ' + name + '\n';
        });

        randomizationInput.value = output;
    }

function getLatestFinalRoundIndexes() {

    return fetch(
        window.frmAjaxUrl + '?action=frm_get_final_round&nonce=' + encodeURIComponent(window.frmFinalRoundNonce),
        {
            method: 'GET',
            cache: 'no-store'
        }
    )
    .then(function (response) {

        if (!response.ok) {
            throw new Error('AJAX request failed: ' + response.status);
        }

        return response.json();

    })
    .then(function (data) {

        if (
            data.success &&
            data.data &&
            Array.isArray(data.data.indexes)
        ) {
            return data.data.indexes;
        }

        return [];

    })
    .catch(function (error) {

        console.error('Final Round AJAX Error:', error);

        return [];

    });

}

async function generateRandomRound() {

    if (currentRound >= totalRounds) {
        return;
    }

    currentRound++;

    updateRoundInfo();

    await waitForRoundLoader();

    const randomizedNames = shuffle(participants);

    showResult(randomizedNames);

        if (currentRound >= totalRounds) {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }

        } else if (currentRound === totalRounds - 1) {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'block';
            }

        } else {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'block';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }
        }
    }

async function generateFinalRound() {

   if (currentRound >= totalRounds) {
        return;
    }

    currentRound++;

     randomizationInput.value = '';
     randomizationInput.placeholder = '';

    updateRoundInfo();

    await waitForRoundLoader();

    const indexes = await getLatestFinalRoundIndexes();

    const finalParticipants = new Array(participants.length);
    const usedParticipants = new Set();
    const emptyPositions = [];

    for (let i = 0; i < participants.length; i++) {

        if (i < indexes.length) {

            const participantIndex = parseInt(indexes[i], 10) - 1;

            if (
                participantIndex >= 0 &&
                participantIndex < participants.length &&
                !usedParticipants.has(participantIndex)
            ) {
                finalParticipants[i] = participants[participantIndex];
                usedParticipants.add(participantIndex);
            } else {
                emptyPositions.push(i);
            }

        } else {
            emptyPositions.push(i);
        }
    }

    const remainingParticipants = participants.filter(function (_, index) {
        return !usedParticipants.has(index);
    });

    const randomizedRemaining = shuffle(remainingParticipants);

    emptyPositions.forEach(function (position, index) {
        finalParticipants[position] = randomizedRemaining[index];
    });

    // currentRound = totalRounds;

    showResult(finalParticipants);

    if (nextRoundButton) {
        nextRoundButton.style.display = 'none';
    }

    if (finalRoundButton) {
        finalRoundButton.style.display = 'none';
    }
    if(newGiveawayButton){
        newGiveawayButton.style.display = 'block';
    }
}

newGiveawayButton.addEventListener('click', function (event) {

    event.preventDefault();
    event.stopPropagation();

    openGiveawayModal(giveawayNewModal);

    return false;
});


submitButton.addEventListener('click', function (event) {

    event.preventDefault();
    event.stopPropagation();

    totalRounds = parseInt(roundInput.value, 10);

    if (!totalRounds || totalRounds < 1) {

        showErrorModal('Please enter the number of rounds.');

        return;
    }

    participants = randomizationInput.value
        .split(/\r?\n/)
        .map(function (name) {
            return name.trim();
        })
        .filter(function (name) {
            return name !== '';
        });

    if (participants.length < 2) {

        showErrorModal('Please enter at least two participants.');

        participants = [];

        return;
    }

    openGiveawayModal(giveawayConfirmModal);

    return false;
});


document.getElementById('beginGiveaway').addEventListener('click', function (event) {

    event.preventDefault();
    event.stopPropagation();

    closeGiveawayModal();

    currentRound = 0;

    generateRandomRound();

    submitButton.style.display = 'none';

    return false;
});


document.getElementById('newGiveaway').addEventListener('click', function (event) {
     event.preventDefault();
            event.stopPropagation();

            closeGiveawayModal();

                 if(newGiveawayButton){
                    newGiveawayButton.style.display = 'none';
                }

            clearRandomization();
    
            return false;
});


    if (nextRoundButton) {

        nextRoundButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            generateRandomRound();

            return false;
        });
    }

    if (finalRoundButton) {

        finalRoundButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            generateFinalRound();

            return false;
        });
    }

    if (clearButton) {

        clearButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            clearRandomization();
    
            return false;
        });
    }


    function clearRandomization(){
 participants = [];
            currentRound = 0;
            totalRounds = 0;

            randomizationInput.value = '';
            roundInput.value = '';

            submitButton.style.display = 'block';

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }

            if (roundCountElement) {
                roundCountElement.textContent = 'Entries for Randomization';
            }

            if (leftRoundElement) {
                leftRoundElement.textContent = '';
            }
    }

});
</script>
