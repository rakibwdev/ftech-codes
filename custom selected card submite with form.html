<script>
document.addEventListener("DOMContentLoaded", function () {

    const button = document.getElementById("workflow-mailto-btn");

    if (!button) return;


    function updateMailto() {

        // Selected Part / Bedrijfstype Handling (ID: selected_part)
        const packageElement = document.getElementById("selected_part");
        let packageName = "";

        if (packageElement) {
            if (packageElement.tagName === "SELECT") {
                // Standard HTML <select> dropdown
                packageName = packageElement.options[packageElement.selectedIndex] 
                    ? packageElement.options[packageElement.selectedIndex].text.trim() 
                    : packageElement.value.trim();
            } else {
                // Custom JS Dropdown: active option ba visible text khujbe
                const activeOption = packageElement.querySelector(".selected, .active, option:checked");
                if (activeOption) {
                    packageName = activeOption.textContent.trim();
                } else {
                    // Custom select-er main element e thaka single text nibe
                    packageName = packageElement.childNodes[0] 
                        ? packageElement.childNodes[0].textContent.trim() 
                        : packageElement.textContent.trim();
                }
            }
        }

        if (!packageName) {
            packageName = "Niet opgegeven";
        }


        // Selected cards values for Body & Subject
        const selectedItems = [];
        const selectedValuesOnly = [];

        document.querySelectorAll(".card.active").forEach(function (card) {

            const value = card.getAttribute("checkbox_value");

            if (value) {
                const trimmedValue = value.trim();
                selectedItems.push("- " + trimmedValue);
                selectedValuesOnly.push(trimmedValue);
            }

        });


        const selectedComponents = selectedItems.join("\n");
        const selectedForSubject = selectedValuesOnly.length > 0 
            ? " (" + selectedValuesOnly.join(", ") + ")" 
            : "";


        // Subject line containing selected parts
        const subject = "WorkflowKompas pakket bespreken - " + packageName ;


        // Body
        const body =
`Hallo WorkflowKompas,

Ik wil graag dit pakket bespreken.

Bedrijfstype: ${packageName}

Geselecteerde onderdelen:
${selectedComponents || "- Geen onderdelen geselecteerd"}

Aanvullende context:

Naam:
Organisatie:
Telefoonnummer:`;


        // Mailto URL
        const mailto =
            "mailto:intshawrov@gmail.com" +
            "?subject=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);


        // Update actual button URL
        button.setAttribute("href", mailto);
        
        return mailto;
    }


    // Initial update
    updateMailto();


    // Dropdown change & click listener for custom select
    const packageElement = document.getElementById("selected_part");
    if (packageElement) {
        packageElement.addEventListener("change", updateMailto);
        packageElement.addEventListener("click", function () {
            setTimeout(updateMailto, 100);
        });
    }


    // Card click event listener
    document.addEventListener("click", function (e) {

        if (e.target.closest(".card")) {

            requestAnimationFrame(function () {
                updateMailto();
            });

        }

    });


    // Button click trigger
    button.addEventListener("click", function (e) {

        e.preventDefault();

        const mailto = updateMailto();

        window.location.href = mailto;

    });

});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const cards = document.querySelectorAll(".card");

    const checkboxGroup = document.querySelector(
        '.elementor-field-group-checkbox_field .elementor-field-subgroup'
    );

    const htmlField = document.querySelector(
        '.elementor-field-type-html'
    );

    if (!checkboxGroup) return;

    const originalOption = checkboxGroup.querySelector("span");

    if (!originalOption) return;

    originalOption.style.display = "none";

    cards.forEach(function (card, index) {

        card.addEventListener("click", function () {

            if (htmlField) {
                htmlField.style.display = "none";
            }

            // Get selected card text
            // const cardText = card.querySelector("p")?.textContent.trim() || "";
            const cardText = card.getAttribute("checkbox_value") || "";


            const checkboxId = "card-checkbox-" + index;

            const existingCheckbox =
                document.getElementById(checkboxId);

            // If already selected, remove it
            if (existingCheckbox) {

                existingCheckbox.closest("span").remove();

                card.classList.remove("active");

                const activeCards =
                    document.querySelectorAll(".card.active");

                if (activeCards.length === 0 && htmlField) {
                    htmlField.style.display = "";
                }

                return;
            }

            // Clone Elementor checkbox option
            const newOption = originalOption.cloneNode(true);

            const checkbox = newOption.querySelector(
                'input[type="checkbox"]'
            );

            const label = newOption.querySelector("label");

            // Set checkbox data
            checkbox.id = checkboxId;

            checkbox.value = cardText;

            /*
             * IMPORTANT:
             * Use checkbox_field instead of email.
             */
            checkbox.name = "form_fields[checkbox_field][]";

            checkbox.checked = true;

            label.setAttribute("for", checkboxId);

            label.textContent = cardText;

            newOption.style.display = "";

            checkboxGroup.appendChild(newOption);

            card.classList.add("active");

            // Trigger Elementor change event
            checkbox.dispatchEvent(
                new Event("change", {
                    bubbles: true
                })
            );

        });

    });

});
</script>

document.addEventListener("DOMContentLoaded", function () {

    const cards = document.querySelectorAll(".card");

    const checkboxGroup = document.querySelector(
        '.elementor-field-type-checkbox .elementor-field-subgroup'
    );

    const htmlField = document.querySelector(
        '.elementor-field-type-html'

    const originalOption = checkboxGroup.querySelector("span");

    if (originalOption) {
        originalOption.style.display = "none";

    cards.forEach(function (card, index) {

        card.addEventListener("click", function () {

            if (htmlField) {
                htmlField.style.display = "none";

            const cardText = card.querySelector("p")?.textContent.trim() || "";

            const checkboxId = "card-checkbox-" + index;

            const existingCheckbox = document.getElementById(checkboxId);

            if (existingCheckbox) {

                existingCheckbox.closest("span").remove();

                card.classList.remove("active");

                // Check if any card is still selected
                const activeCards = document.querySelectorAll(".card.active");

                // If no card is selected, show HTML field again
                if (activeCards.length === 0 && htmlField) {
                    htmlField.style.display = "";
                }

                return;
            }

            const newOption = originalOption.cloneNode(true);

            const checkbox = newOption.querySelector(
                'input[type="checkbox"]'
            );

            const label = newOption.querySelector("label");

            checkbox.id = checkboxId;

            checkbox.value = cardText;

            checkbox.name = "form_fields[email][]";

            checkbox.checked = true;

            label.setAttribute("for", checkboxId);
            label.textContent = cardText;

            newOption.style.display = "";

            checkboxGroup.appendChild(newOption);

            card.classList.add("active");

            checkbox.dispatchEvent(
                new Event("change", {
                    bubbles: true
                })
            );

        });

    });

});
