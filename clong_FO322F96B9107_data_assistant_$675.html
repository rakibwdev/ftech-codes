const swiper = new Swiper('.swiper', {
});

document.querySelectorAll('.pagination_text li').forEach((item, index) => {
  item.addEventListener('click', () => {
    swiper.slideTo(index);
  });
});
swiper.on('slideChange', () => {
  document.querySelectorAll('.pagination_text li').forEach(li => {
    li.classList.remove('active');
  });

  document.querySelectorAll('.pagination_text li')[swiper.activeIndex].classList.add('active');
});

</script>
