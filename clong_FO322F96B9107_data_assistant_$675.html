<!-- Event Carousol -->
<script>
document.addEventListener("DOMContentLoaded", () => {
const swiperEl = document.querySelector('.event_swiper .swiper');

if (swiperEl) {

  const event_swiper = new Swiper(swiperEl, {});

  const paginations = document.querySelectorAll('.event_pagination');

  if (paginations.length > 0) {
    paginations[0].classList.add('active');
  }

  paginations.forEach((item, index) => {
    item.addEventListener('click', () => {
      event_swiper.slideTo(index);
    });
  });

  event_swiper.on('slideChange', () => {
    paginations.forEach(li => li.classList.remove('active'));

    if (paginations[event_swiper.activeIndex]) {
      paginations[event_swiper.activeIndex].classList.add('active');
    }
  });

}

});
</script>
