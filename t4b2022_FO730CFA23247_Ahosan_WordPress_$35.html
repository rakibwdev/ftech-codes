<script>
    const icon = document.querySelector(".float_icon");
    const content = document.querySelector(".float_content");

    icon.addEventListener("click", function () {
        content.classList.toggle("active");
        icon.classList.toggle("active");
    });
</script>

<style>

.float_icon {
    width: 50px;
    height: 50px;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s;
}

.float_content {
    bottom: -70px;
    opacity:0;
    pointer-events:none;
    transition: 0.3s;
}

.float_content.active {
    bottom:15px;
    opacity:1;
    pointer-events:all;
}

.float_icon.active {
    rotate: 45deg;
}
