<script>
function updateDateTime() {
    const now = new Date();

    const options = {
        month: 'short',
        day: '2-digit',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    document.getElementById('live-datetime').textContent =
        now.toLocaleString('en-US', options);
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>


<!-- randomize -->
 <script>
document.addEventListener('DOMContentLoaded', function () {

    const roundInput = document.getElementById('e-form-round');
    const randomizationInput = document.getElementById('e-form-randomization');

    const submitButton = document.getElementById('submit-button');
    const nextRoundButton = document.getElementById('next-round');
    const clearButton = document.getElementById('clear-button');

    if (!roundInput || !randomizationInput || !submitButton || !nextRoundButton) {
        return;
    }

    // Store original participants
    let participants = [];

    // Current round
    let currentRound = 0;

    // Total rounds
    let totalRounds = 0;


    // Hide Next Round initially
    nextRoundButton.style.display = 'none';


    // Fisher-Yates shuffle
    function shuffle(array) {

        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
    }


    // Generate one round
    function generateRound() {

        if (currentRound >= totalRounds) {
            return;
        }

        currentRound++;

        // Randomize ORIGINAL participants
        const randomizedNames = shuffle(participants);

        let output = '';

        randomizedNames.forEach(function (name, index) {

            output += (index + 1) + '. ' + name + '\n';

        });

        // Show only current round result
        randomizationInput.value = output;


        // If final round
        if (currentRound >= totalRounds) {

            nextRoundButton.style.display = 'none';

        } else {

            nextRoundButton.style.display = 'block';

        }

        console.log('Round ' + currentRound, randomizedNames);
    }


    // =========================
    // SUBMIT BUTTON
    // =========================

    submitButton.addEventListener('click', function (event) {

        event.preventDefault();
        event.stopPropagation();

        // Get total rounds
        totalRounds = parseInt(roundInput.value, 10);

        if (!totalRounds || totalRounds < 1) {

            alert('Please enter the number of rounds.');

            return;
        }


        // Get participants ONLY ONCE
        participants = randomizationInput.value
            .split(/\r?\n/)
            .map(function (name) {
                return name.trim();
            })
            .filter(function (name) {
                return name !== '';
            });


        if (participants.length < 2) {

            alert('Please enter at least two participants.');

            participants = [];

            return;
        }


        // Reset round
        currentRound = 0;


        // Generate first round
        generateRound();


        // Hide Submit
        submitButton.style.display = 'none';


        // Show Next Round
        if (totalRounds > 1) {
            nextRoundButton.style.display = 'block';
        }


        return false;
    });


    // =========================
    // NEXT ROUND BUTTON
    // =========================

    nextRoundButton.addEventListener('click', function (event) {

        event.preventDefault();
        event.stopPropagation();

        generateRound();

        return false;
    });


    // =========================
    // CLEAR BUTTON
    // =========================

    if (clearButton) {

        clearButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            // Reset everything
            participants = [];
            currentRound = 0;
            totalRounds = 0;

            // Clear textarea
            randomizationInput.value = '';

            // Clear round
            roundInput.value = '';

            // Show Submit again
            submitButton.style.display = 'block';

            // Hide Next Round
            nextRoundButton.style.display = 'none';

            return false;
        });
    }

});
</script>
