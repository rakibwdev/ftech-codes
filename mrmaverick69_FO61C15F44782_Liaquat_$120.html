<script>
function updateDateTime() {
    const now = new Date();

    const options = {
        month: 'short',
        day: '2-digit',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    document.getElementById('live-datetime').textContent =
        now.toLocaleString('en-US', options);
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
