<script>
function updateDateTime() {
    const now = new Date();

    const options = {
        month: 'short',
        day: '2-digit',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    document.getElementById('live-datetime').textContent =
        now.toLocaleString('en-US', options);
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>


<!-- randomize -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    const roundInput = document.getElementById('e-form-round');
    const randomizationInput = document.getElementById('e-form-randomization');

    const submitButton = document.getElementById('submit-button');
    const nextRoundButton = document.getElementById('next-round');
    const finalRoundButton = document.getElementById('final-round');
    const clearButton = document.getElementById('clear-button');

    if (!roundInput || !randomizationInput || !submitButton) {
        return;
    }

    let participants = [];
    let currentRound = 0;
    let totalRounds = 0;

    if (nextRoundButton) {
        nextRoundButton.style.display = 'none';
    }

    if (finalRoundButton) {
        finalRoundButton.style.display = 'none';
    }

    function shuffle(array) {
        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
    }

    function generateRound() {

        if (currentRound >= totalRounds) {
            return;
        }

        currentRound++;

        const randomizedNames = shuffle(participants);

        let output = '';

        randomizedNames.forEach(function (name, index) {
            output += (index + 1) + '. ' + name + '\n';
        });

        randomizationInput.value = output;

        if (currentRound >= totalRounds) {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }

        } else if (currentRound === totalRounds - 1) {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'block';
            }

        } else {

            if (nextRoundButton) {
                nextRoundButton.style.display = 'block';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }
        }
    }

    submitButton.addEventListener('click', function (event) {

        event.preventDefault();
        event.stopPropagation();

        totalRounds = parseInt(roundInput.value, 10);

        if (!totalRounds || totalRounds < 1) {
            alert('Please enter the number of rounds.');
            return;
        }

        participants = randomizationInput.value
            .split(/\r?\n/)
            .map(function (name) {
                return name.trim();
            })
            .filter(function (name) {
                return name !== '';
            });

        if (participants.length < 2) {
            alert('Please enter at least two participants.');
            participants = [];
            return;
        }

        currentRound = 0;

        generateRound();

        submitButton.style.display = 'none';

        return false;
    });

    if (nextRoundButton) {

        nextRoundButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            generateRound();

            return false;
        });
    }

    if (finalRoundButton) {

        finalRoundButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            generateRound();

            return false;
        });
    }

    if (clearButton) {

        clearButton.addEventListener('click', function (event) {

            event.preventDefault();
            event.stopPropagation();

            participants = [];
            currentRound = 0;
            totalRounds = 0;

            randomizationInput.value = '';
            roundInput.value = '';

            submitButton.style.display = 'block';

            if (nextRoundButton) {
                nextRoundButton.style.display = 'none';
            }

            if (finalRoundButton) {
                finalRoundButton.style.display = 'none';
            }

            return false;
        });
    }

});
</script>
