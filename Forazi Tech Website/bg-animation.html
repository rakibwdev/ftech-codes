<!-- class="contact-animation-bg" -->

<script>
    
(function () {
    function initContactAnimation() {
        const containers = document.querySelectorAll(
            ".contact-animation-bg"
        );

        containers.forEach((container) => {
            if (container.dataset.animationInitialized) return;
            container.dataset.animationInitialized = "true";

            // Prepare the container
            const styles = getComputedStyle(container);

            if (styles.position === "static") {
                container.style.position = "relative";
            }

            container.style.overflow = "hidden";
            container.style.isolation = "isolate";

            // Create canvas automatically
            const canvas = document.createElement("canvas");
            canvas.setAttribute("aria-hidden", "true");

            Object.assign(canvas.style, {
                position: "absolute",
                inset: "0",
                width: "100%",
                height: "100%",
                zIndex: "0",
                pointerEvents: "none"
            });

            container.prepend(canvas);

            const ctx = canvas.getContext("2d");
            if (!ctx) return;

            let width = 0;
            let height = 0;
            let dpr = 1;
            let time = 0;
            let lastTime = 0;
            let raf = null;
            const SPEED = 0.5;

            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );

            let particles = [];

            function resize() {
                const rect = container.getBoundingClientRect();

                width = rect.width;
                height = rect.height;
                dpr = Math.min(window.devicePixelRatio || 1, 1.5);

                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const count = Math.min(
                    65,
                    Math.max(20, Math.floor(width * height / 15000))
                );

                particles = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: 1 + Math.random() * 2,
                    speed: 4 + Math.random() * 9,
                    phase: Math.random() * Math.PI * 2,
                    alpha: 0.15 + Math.random() * 0.35
                }));

                render(0);
            }

            function render(delta) {
                // Soft ivory background
                const bg = ctx.createLinearGradient(
                    0, 0, width, height
                );

                bg.addColorStop(0, "#eef0e3");
                bg.addColorStop(0.5, "#f8f8ef");
                bg.addColorStop(1, "#e9edda");

                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, width, height);

                // Ambient glow
                const glow = ctx.createRadialGradient(
                    width * 0.5, height * 0.45, 0,
                    width * 0.5, height * 0.45,
                    Math.max(width, height) * 0.7
                );

                glow.addColorStop(0, "rgba(255,255,250,0.7)");
                glow.addColorStop(1, "rgba(255,255,250,0)");

                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);

                // Elegant flowing ribbons
                ctx.lineCap = "round";

                for (let band = 0; band < 9; band++) {
                    const centerOffset =
                        (band - 4) * height * 0.035;

                    ctx.beginPath();

                    for (let i = 0; i <= 100; i++) {
                        const p = i / 100;
                        const x = p * width;

                        const y =
                            height * 0.5 +
                            centerOffset +
                            Math.sin(
                                p * Math.PI * 2 +
                                time * 0.35 +
                                band * 0.38
                            ) * height * 0.105 +
                            Math.sin(
                                p * Math.PI * 3 -
                                time * 0.2
                            ) * height * 0.025;

                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }

                    ctx.strokeStyle =
                        band % 3 === 0
                            ? "rgba(94,124,52,0.25)"
                            : "rgba(169,190,112,0.25)";

                    ctx.lineWidth = band % 3 === 0 ? 1.3 : 0.7;
                    ctx.stroke();
                }

                // Wide, translucent flowing ribbons
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();

                    for (let j = 0; j <= 100; j++) {
                        const p = j / 100;
                        const x = p * width;

                        const y =
                            height * 0.5 +
                            Math.sin(
                                p * Math.PI * 2 +
                                time * 0.22 +
                                i * 1.5
                            ) * height * 0.17 +
                            (i - 1) * height * 0.09;

                        if (j === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }

                    ctx.strokeStyle = "rgba(125,151,76,0.11)";
                    ctx.lineWidth = Math.max(6, height * 0.025);
                    ctx.stroke();

                    // Bright edge creates a subtle glass-like effect
                    ctx.strokeStyle = "rgba(255,255,245,0.55)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Floating particles
                particles.forEach((p) => {
                    if (!reducedMotion.matches) {
                        p.x += p.speed * delta / 1000;

                        p.y += Math.sin(
                            time + p.phase
                        ) * delta * 0.008;
                    }

                    if (p.x > width + 5) p.x = -5;

                    ctx.beginPath();
                    ctx.arc(
                        p.x,
                        p.y,
                        p.r * (
                            0.9 +
                            Math.sin(time * 1.5 + p.phase) * 0.1
                        ),
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = "#78934b";
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }

            function animate(timestamp) {
                raf = null;

                if (document.hidden || width <= 0 || height <= 0) {
                    return;
                }

                const delta = lastTime
                    ? Math.min(timestamp - lastTime, 40)
                    : 16;

                lastTime = timestamp;

                if (!reducedMotion.matches) {
                    time += (delta / 1000) * SPEED;
                }

                render(delta);
                raf = requestAnimationFrame(animate);
            }

            function start() {
                if (raf === null && !document.hidden) {
                    lastTime = 0;
                    raf = requestAnimationFrame(animate);
                }
            }

            function stop() {
                if (raf !== null) {
                    cancelAnimationFrame(raf);
                    raf = null;
                }
            }

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    stop();
                } else {
                    start();
                }
            });

            if ("ResizeObserver" in window) {
                new ResizeObserver(resize).observe(container);
            } else {
                window.addEventListener("resize", resize);
            }

            resize();
            start();
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initContactAnimation
        );
    } else {
        initContactAnimation();
    }
})();

</script>
