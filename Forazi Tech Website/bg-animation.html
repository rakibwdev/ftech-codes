<!-- class="contact-animation-bg" -->

<script>
    
(function () {
    function init() {
        document.querySelectorAll(".contact-animation-bg").forEach(el => {
            if (el.dataset.greenFlowReady) return;
            el.dataset.greenFlowReady = "1";

            const SPEED = 0.35;
            const INTENSITY = 1;
            const COLORS = {
                dark: "#EAF4E5",
                green: "#A8D58D",
                deep: "#D6EACB"
            };

            if (getComputedStyle(el).position === "static") {
                el.style.position = "relative";
            }
            el.style.overflow = "hidden";
            el.style.isolation = "isolate";

            const canvas = document.createElement("canvas");
            canvas.setAttribute("aria-hidden", "true");

            Object.assign(canvas.style, {
                position: "absolute",
                inset: "0",
                width: "100%",
                height: "100%",
                zIndex: "0",
                pointerEvents: "none"
            });

            el.prepend(canvas);

            [...el.children].forEach(child => {
                if (child === canvas) return;
                if (getComputedStyle(child).position === "static") {
                    child.style.position = "relative";
                }
                child.style.zIndex = "1";
            });

            const ctx = canvas.getContext("2d");
            if (!ctx) return;

            let w = 0, h = 0, dpr = 1;
            let t = 0, last = 0, raf = null;

            const reducedMotion = matchMedia(
                "(prefers-reduced-motion: reduce)"
            );

            const shapes = [
                {
                    x: 0.10, y: 0.18, size: 0.82,
                    phase: 0.3, speed: 0.19,
                    color: [75, 133, 29]
                },
                {
                    x: 0.68, y: 0.34, size: 0.70,
                    phase: 2.5, speed: -0.15,
                    color: [29, 81, 24]
                },
                {
                    x: 0.37, y: 0.78, size: 0.78,
                    phase: 4.1, speed: 0.13,
                    color: [55, 110, 31]
                }
            ];

            function resize() {
                const r = el.getBoundingClientRect();
                w = r.width;
                h = r.height;
                dpr = Math.min(devicePixelRatio || 1, 1.5);

                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                render();
            }

            function rgb(c, a) {
                return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
            }

            function background() {
                const bg = ctx.createLinearGradient(0, 0, w, h);
                bg.addColorStop(0, COLORS.dark);
                bg.addColorStop(0.55, "#F5F9F0");
                bg.addColorStop(1, COLORS.green);

                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                // Deep cinematic shadow
                const shadow = ctx.createRadialGradient(
                    w * 0.48, h * 0.45, 0,
                    w * 0.48, h * 0.45,
                    Math.max(w, h) * 0.85
                );

                shadow.addColorStop(0, "rgba(0,0,0,0)");
                shadow.addColorStop(1, "rgba(0,12,2,0.12)");

                ctx.fillStyle = shadow;
                ctx.fillRect(0, 0, w, h);
            }

            function drawShape(s, index) {
                const phase = t * s.speed + s.phase;

                const cx = w * (
                    s.x +
                    Math.sin(phase * 0.8) * 0.15 * INTENSITY
                );

                const cy = h * (
                    s.y +
                    Math.cos(phase * 0.65) * 0.18 * INTENSITY
                );

                const rw = w * s.size * 0.64;
                const rh = h * s.size * 0.48;

                const wobble = Math.sin(phase * 1.3) * 0.13;
                const turn = phase * 0.16;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(turn);

                ctx.beginPath();
                ctx.moveTo(-rw * 0.85, -rh * 0.25);

                ctx.bezierCurveTo(
                    -rw * (0.48 + wobble), -rh * 1.25,
                    rw * 0.12, -rh * (0.78 - wobble),
                    rw * 0.90, -rh * 0.48
                );

                ctx.bezierCurveTo(
                    rw * 1.22, -rh * 0.24,
                    rw * 0.48, rh * 0.12,
                    rw * 0.24, rh * 0.46
                );

                ctx.bezierCurveTo(
                    -rw * 0.08, rh * 0.95,
                    -rw * 0.65, rh * 0.66,
                    -rw * 0.85, -rh * 0.25
                );

                ctx.closePath();

                const grad = ctx.createLinearGradient(
                    -rw, -rh, rw, rh
                );

                grad.addColorStop(0, rgb(s.color, 0.02));
                grad.addColorStop(0.22, rgb(s.color, 0.22));
                grad.addColorStop(0.43, rgb(s.color, 0.50));
                grad.addColorStop(0.58, "rgba(100,140,75,0.12)");
                grad.addColorStop(0.77, rgb(s.color, 0.28));
                grad.addColorStop(1, rgb(s.color, 0.02));

                ctx.fillStyle = grad;
                ctx.shadowColor = rgb(s.color, 0.19);
                ctx.shadowBlur = Math.max(18, rh * 0.32);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.globalCompositeOperation = "screen";

                const shine = ctx.createRadialGradient(
                    -rw * 0.22, -rh * 0.25, 0,
                    -rw * 0.12, -rh * 0.20,
                    rw * 0.75
                );

                shine.addColorStop(0, "rgba(195,235,147,0.14)");
                shine.addColorStop(0.38, "rgba(105,167,65,0.06)");
                shine.addColorStop(1, "rgba(75,133,29,0)");

                ctx.fillStyle = shine;
                ctx.fill();

                ctx.globalCompositeOperation = "source-over";
                ctx.beginPath();
                ctx.moveTo(-rw * 0.68, -rh * 0.24);

                ctx.bezierCurveTo(
                    -rw * 0.40, -rh * 0.88,
                    rw * 0.05, -rh * 0.56,
                    rw * 0.53, -rh * 0.46
                );

                ctx.strokeStyle = "rgba(195,225,163,0.12)";
                ctx.lineWidth = Math.max(0.8, h * 0.0015);
                ctx.stroke();

                ctx.restore();
            }

            function render() {
                background();

                const gx = w * (
                    0.50 + Math.sin(t * 0.17) * 0.22
                );

                const gy = h * (
                    0.50 + Math.cos(t * 0.14) * 0.20
                );

                const light = ctx.createRadialGradient(
                    gx, gy, 0,
                    gx, gy, Math.max(w, h) * 0.62
                );

                light.addColorStop(0, "rgba(95,150,43,0.15)");
                light.addColorStop(0.5, "rgba(36,91,22,0.07)");
                light.addColorStop(1, "rgba(0,0,0,0)");

                ctx.fillStyle = light;
                ctx.fillRect(0, 0, w, h);

                shapes.forEach(drawShape);

                const edge = ctx.createRadialGradient(
                    w * 0.5, h * 0.5, Math.min(w, h) * 0.15,
                    w * 0.5, h * 0.5, Math.max(w, h) * 0.78
                );

                edge.addColorStop(0, "rgba(0,0,0,0)");
                edge.addColorStop(1, "rgba(30,65,20,0.08)");

                ctx.fillStyle = edge;
                ctx.fillRect(0, 0, w, h);
            }

            function animate(now) {
                raf = null;
                if (document.hidden || !w || !h) return;

                const dt = last ? Math.min(now - last, 40) : 16;
                last = now;

                if (!reducedMotion.matches) {
                    t += dt * 0.001 * SPEED;
                }

                render();
                raf = requestAnimationFrame(animate);
            }

            function start() {
                if (raf === null && !document.hidden) {
                    last = 0;
                    raf = requestAnimationFrame(animate);
                }
            }

            function stop() {
                if (raf !== null) cancelAnimationFrame(raf);
                raf = null;
            }

            document.addEventListener("visibilitychange", () => {
                document.hidden ? stop() : start();
            });

            if ("ResizeObserver" in window) {
                new ResizeObserver(resize).observe(el);
            } else {
                window.addEventListener("resize", resize);
            }

            reducedMotion.addEventListener?.("change", render);

            resize();
            start();
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();

</script>
