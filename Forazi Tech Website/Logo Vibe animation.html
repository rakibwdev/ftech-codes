
<script>
(function () {
  const SPEED = 0.35;
  const SCALE = 1.0;     

  const LOGO_PATH = "M58.4 55.7 L56.7 55.8 L39.3 63.6 L36.3 65.6 L33.0 69.2 L31.1 72.8 L30.1 76.5 L30.0 98.6 L30.3 99.9 L40.2 99.9 L40.6 83.7 L41.5 80.3 L43.3 76.8 L46.7 72.9 L49.2 71.0 L60.8 65.8 L62.4 64.6 L59.3 57.0 Z M82.7 2.0 L82.0 1.3 L81.0 1.2 L76.9 2.5 L72.4 2.7 L68.5 1.7 L67.3 0.9 L66.7 0.0 L65.2 0.0 L64.7 0.8 L62.1 2.1 L61.8 3.2 L65.9 6.6 L66.2 7.2 L65.4 8.0 L29.6 24.5 L26.7 26.5 L22.9 30.9 L21.9 32.7 L20.8 36.7 L21.0 43.0 L23.0 47.9 L24.8 50.4 L28.4 53.4 L32.7 55.3 L34.8 55.7 L40.3 55.5 L43.8 54.5 L71.2 41.5 L71.6 40.4 L67.8 32.7 L67.2 32.2 L64.6 33.1 L58.1 36.6 L37.7 45.2 L35.6 45.0 L33.7 44.1 L31.6 41.5 L31.1 39.0 L32.3 36.1 L34.7 34.1 L71.5 17.0 L72.6 17.5 L73.7 22.6 L74.8 22.6 L78.3 20.5 L79.0 19.5 L78.7 16.3 L79.5 12.1 L81.5 8.8 L84.6 6.1 L84.6 5.4 Z";
  const STAR_PATH = "M15.9 48.7 L15.6 49.2 L15.0 53.9 L13.9 56.8 L12.4 59.6 L8.5 63.9 L4.7 66.3 L3.7 67.3 L8.6 67.9 L11.4 68.9 L15.4 71.0 L18.9 74.1 L21.9 78.8 L22.4 78.9 L22.8 78.4 L23.8 72.6 L26.5 67.5 L30.3 63.4 L34.6 60.7 L33.7 60.3 L31.6 60.1 L28.2 59.3 L25.2 58.1 L22.4 56.2 L19.9 54.0 L17.9 51.5 L16.6 49.1 Z";
  const BOX = 100, BW = 85.8, STAR_C = [19.2, 63.8];

const BG = ["#EAF4E5", "#F5F9F0", "#FFFFFF"];
const mouseSpeed = 0.02;

const IRIS = [
  [0.00, "rgba(234,244,229,0)"],
  [0.20, "rgba(235,248,226,0.95)"],
  [0.40, "rgba(210,238,190,0.95)"],
  [0.60, "rgba(180,220,150,0.90)"],
  [0.80, "rgba(145,200,110,0.80)"],
  [1.00, "rgba(234,244,229,0)"]
];

  const ITEMS = [
    { x: 0.80, y: 0.42, s: 0.95, z: 0.2, rot: -0.10, ph: 0.0, sp: 0.6 },
    { x: 0.64, y: 0.78, s: 0.55, z: 0.6, rot:  0.14, ph: 2.1, sp: 0.8 },
    { x: 0.93, y: 0.82, s: 0.42, z: 0.9, rot: -0.18, ph: 4.0, sp: 0.7 },
    { x: 0.14, y: 0.25, s: 0.50, z: 0.1, rot:  0.12, ph: 5.2, sp: 0.5 }
  ];

  function init() {
    document.querySelectorAll(".contact-animation-bg").forEach(el => {
      if (el.dataset.greenFlowReady) return;
      el.dataset.greenFlowReady = "1";

      if (getComputedStyle(el).position === "static") el.style.position = "relative";
      el.style.overflow = "hidden";
      el.style.isolation = "isolate";

      const canvas = document.createElement("canvas");
      canvas.setAttribute("aria-hidden", "true");
      Object.assign(canvas.style, { position: "absolute", inset: "0", width: "100%",
        height: "100%", zIndex: "0", pointerEvents: "none" });
      el.prepend(canvas);
      [...el.children].forEach(c => {
        if (c === canvas) return;
        if (getComputedStyle(c).position === "static") c.style.position = "relative";
        c.style.zIndex = "1";
      });

      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.lineJoin = "round"; const logo = new Path2D(LOGO_PATH), star = new Path2D(STAR_PATH);

      let w = 0, h = 0, dpr = 1, t = 0, last = 0, raf = null;
      let mx = 0, my = 0, tx = 0, ty = 0;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

      function resize() {
        const r = el.getBoundingClientRect();
        w = r.width; h = r.height;
        dpr = Math.min(devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      function background() {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, BG[0]); g.addColorStop(0.6, BG[1]); g.addColorStop(1, BG[2]);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

        // slow drifting fog
        for (let i = 0; i < 3; i++) {
          const x = w * (0.3 + 0.4 * i + Math.sin(t * 0.4 + i * 2) * 0.12);
          const y = h * (0.35 + Math.cos(t * 0.3 + i) * 0.15);
          const r = Math.max(w, h) * 0.45;
          const f = ctx.createRadialGradient(x, y, 0, x, y, r);
          f.addColorStop(0, i === 1 ? "rgba(255,255,255,0.7)" : "rgba(205,207,212,0.55)");
          f.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = f; ctx.fillRect(0, 0, w, h);
        }
      }

      function irisGradient(o, x0) {
        const g = ctx.createLinearGradient(x0, 0, x0 + 110, 100);
        IRIS.forEach(s => g.addColorStop(s[0], s[1]));
        return g;
      }

      function drawItem(o) {
        const m = Math.min(w, h), size = m * o.s * 1.5 * SCALE, k = size / BOX;
        const d = t * o.sp * 0.3 + o.ph;
        const cx = w * o.x + Math.sin(d) * w * 0.02 + mx * (10 + o.z * 40);
        const cy = h * o.y + Math.cos(d * 0.8) * h * 0.03 + my * (10 + o.z * 40);
        const flip = 0.86 + 0.14 * Math.cos(t * o.sp * 0.6 + o.ph);
        const a = 0.55 + o.z * 0.45;
        const x0 = -60 + 80 * Math.sin(t * o.sp * 0.7 + o.ph);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(o.rot + Math.sin(d * 0.7) * 0.06);
        ctx.transform(flip, 0, Math.sin(t * 0.3 + o.ph) * 0.1, 1, 0, 0);
        ctx.scale(k, k);
        ctx.translate(-BW / 2, -BOX / 2);
        ctx.globalAlpha = a;

        // soft grey shadow + clear glass body
        ctx.shadowColor = "rgba(40,45,60,0.12)";
        ctx.shadowBlur = 30 / k; ctx.shadowOffsetY = 12 / k;
        const body = ctx.createLinearGradient(20, 0, 85, 100);
        body.addColorStop(0, "rgba(255,255,255,0.55)");
        body.addColorStop(0.5, "rgba(255,255,255,0.12)");
        body.addColorStop(1, "rgba(235,238,245,0.40)");
        ctx.fillStyle = body; ctx.fill(logo);
        ctx.shadowColor = "transparent";

        // iridescent inner bevel (clipped stroke), like the glass edges
        ctx.save();
        ctx.clip(logo);
        ctx.lineJoin = "round";
        ctx.lineWidth = 7 / k;
        ctx.strokeStyle = irisGradient(o, x0);
        ctx.globalAlpha = a * 0.55;
        ctx.stroke(logo);
        ctx.restore();

        // crisp rim
        ctx.lineWidth = 1.6 / k;
        ctx.strokeStyle = irisGradient(o, x0 + 25);
        ctx.globalAlpha = a;
        ctx.stroke(logo);
        ctx.lineWidth = 0.8 / k;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.stroke(logo);

        // glass sparkle (logo star), twinkling
        const tw = 0.85 + 0.15 * Math.sin(t * 2.5 * o.sp + o.ph);
        ctx.translate(STAR_C[0], STAR_C[1]); ctx.scale(tw, tw); ctx.translate(-STAR_C[0], -STAR_C[1]);

      const sg = ctx.createLinearGradient(0, 48, 36, 80);
        sg.addColorStop(0, "rgba(255,255,255,1)");
        sg.addColorStop(0.5, "rgba(235,248,226,0.95)");
        sg.addColorStop(1, "rgba(205,235,185,0.85)");

        ctx.shadowColor = "rgba(205,235,185,0.3)";
        ctx.shadowBlur = 16 / k;
        ctx.fillStyle = sg;
        ctx.fill(star);

        ctx.shadowColor = "transparent";
        ctx.lineWidth = 1.4 / k;
        ctx.strokeStyle = irisGradient(o, x0 + 50);
        ctx.stroke(star);
        ctx.restore();
      }

      function render() {
        background();
        ITEMS.slice().sort((a, b) => a.z - b.z).forEach(drawItem);
      }

      function animate(now) {
        raf = null;
        if (document.hidden || !w || !h) return;
        const dt = last ? Math.min(now - last, 40) : 16;
        last = now;
        mx += (tx - mx) * mouseSpeed; my += (ty - my) * mouseSpeed;
        if (!reducedMotion.matches) t += dt * 0.001 * SPEED * 3;
        render();
        raf = requestAnimationFrame(animate);
      }
      const start = () => { if (raf === null && !document.hidden) { last = 0; raf = requestAnimationFrame(animate); } };
      const stop = () => { if (raf !== null) cancelAnimationFrame(raf); raf = null; };

      el.addEventListener("pointermove", e => {
        const r = el.getBoundingClientRect();
        tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
        ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
      });
      document.addEventListener("visibilitychange", () => { document.hidden ? stop() : start(); });
      if ("ResizeObserver" in window) new ResizeObserver(resize).observe(el);
      else window.addEventListener("resize", resize);
      reducedMotion.addEventListener?.("change", render);

      resize();
      start();
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
