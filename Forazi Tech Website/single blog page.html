
add_shortcode( 'author_designation', function() {

    $author_id = get_the_author_meta( 'ID' );

    if ( ! $author_id ) {
        return '';
    }

    $designation = get_field( 'designation', 'user_' . $author_id );

    if ( empty( $designation ) ) {
        return '';
    }

    return esc_html( $designation );
});
