<script>
    jQuery(function ($) {

    let targetSlide = 0;

    $(document).on('click', '.home_grid > a', function (e) {

        e.preventDefault();

        targetSlide = $('.home_grid > a').index(this);
        $('body').addClass('opening-shop-look');

        elementorProFrontend.modules.popup.showPopup({
            id: 476
        });
    });

    $(document).on('elementor/popup/show', function (event, popupId) {

        if (popupId !== 476) {
            return;
        }

        const popup = document.querySelector('#elementor-popup-modal-476');

        if (!popup) {
            return;
        }

        popup.classList.add('shop-look-loading');

        function setCorrectSlide() {

            const swiperElement = popup.querySelector('.swiper');

            if (!swiperElement || !swiperElement.swiper) {
                setTimeout(setCorrectSlide, 50);
                return;
            }

            const swiper = swiperElement.swiper;

            swiper.slideToLoop(targetSlide, 0);

            swiper.update();

            requestAnimationFrame(function () {

                popup.classList.remove('shop-look-loading');
                $('body').removeClass('opening-shop-look');

            });
        }

        setCorrectSlide();

    });


    $(document).on('elementor/popup/hide', function (event, popupId) {

        if (popupId === 476) {

            const popup = document.querySelector('#elementor-popup-modal-476');

            if (popup) {
                popup.classList.remove('shop-look-loading');
            }

            $('body').removeClass('opening-shop-look');
        }

    });

});
</script>


<style>

    #elementor-popup-modal-476.shop-look-loading .dialog-widget-content {

    #elementor-popup-modal-476.shop-look-loading {
