<style>
    selector .elementor-icon{
    position: relative;
}

selector .elementor-icon::before{
    content: "";
    width: 40%;
    height: 40%;
    top:20%;
    background: var(--secondary);
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 16px;
    animation: pulseAnim 1.5s infinite ease-out;
}

@keyframes pulseAnim{
    0%{
        transform: scale(1);
        opacity: 1;
    }

    100%{
        transform: scale(1.5);
        opacity: 0;
    }
}
</style>
<!-- end online active status css -->

    <script>
        const getFormSendMsgFild = document.querySelector('#form_send_message');
				if(getFormSendMsgFild) getFormSendMsgFild.setAttribute('show_status', false);
        document.querySelectorAll('[name="form_fields[Iertips]"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                const tipsField = document.querySelector('#form_send_message .tips_fild');
                const selectedTps = document.querySelector('[name="form_fields[Iertips]"]:checked');
                if(tipsField && selectedTps){
                    tipsField.innerHTML = selectedTps.value;
                }
            });
        });

        document.querySelector('[name="form_fields[field_71daf24]"]').addEventListener('input', function(event) {
            const modelName = document.querySelector('#form_send_message .model_name');
            console.log(this.value);
            if(this.value && modelName){
                modelName.innerHTML = this.value;
            }
        });

        document.querySelector('#form_send_message .back_to_form').addEventListener('click', function(event) {
            if(getFormSendMsgFild){
                getFormSendMsgFild.setAttribute('show_status', false);
            }            
        });

        jQuery(document).ajaxSuccess(function(event, xhr, settings, data) {
            if (settings.url.includes('wp-admin/admin-ajax.php') && data.success && data.data.message.includes('submission was successful')) {
                if(getFormSendMsgFild){
                    getFormSendMsgFild.setAttribute('show_status', true);
                }
            }
        });
    </script>
    
<script>
    function updateShopStatus() {
        const statusEl = document.querySelector('.shop_ac_status');
        if (!statusEl) return;
    
        const now = new Date();
        const currentHours = now.getHours();
        const currentMinutes = now.getMinutes();
    
        // Convert current time to minutes
        const currentTime = currentHours * 60 + currentMinutes;
    
        // Opening and closing time (in minutes)
        const openTime = 10 * 60;   // 10:00
        const closeTime = 21 * 60;  // 21:00
    
        if (currentTime >= openTime && currentTime < closeTime) {
            statusEl.textContent = 'ATVĒRTS'; // Open
        } else {
            statusEl.textContent = 'SLĒGTS'; // Closed
        }
    }
    
    // Run on load
    updateShopStatus();
</script>
<script>
    if(googleReviews && Array.isArray(googleReviews)  && googleReviews.length > 0){
        document.querySelectorAll(".google_review").forEach(function(reviewElement, index) {
            const review = googleReviews[index];
            if(!review) return;
            reviewElement.querySelector(".name span").textContent = review.user;
            reviewElement.querySelector(".google_rating").setAttribute("review_rating", review.rating);
            if(review.text){
                reviewElement.querySelector(".main_review p").innerHTML = review.text;
            }else{
                reviewElement.querySelector(".main_review p").innerHTML = "This user only left a rating.";
            }
            reviewElement.querySelector(".user_image").setAttribute("style", "background-image: url('" + review.user_photo + "')");
        });
    }
</script>
