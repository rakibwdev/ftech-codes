<script>
document.addEventListener("DOMContentLoaded", function () {

    const radios = document.querySelectorAll(
        '.contact_fomt .elementor-field-group-Iertips input[type="radio"]'
    );

    const modelField = document.querySelector(
        '.contact_fomt .elementor-field-group-models'
    );

    function toggleField() {
        if (radios[0] && radios[0].checked) {
            modelField.style.display = "block";
        } else {
            modelField.style.display = "none";
        }
    }

    radios.forEach(r => r.addEventListener("change", toggleField));

    toggleField();
});
</script>


<!-- tab form -->

<script>
function createTargetBox() {
  const label = document.querySelector('label[for="form-field-message"]');
  
  if (!label) return;

  // check if already exists (avoid duplicate)
  let box = document.getElementById('selected-tab-info');
  if (!box) {
    box = document.createElement('div');
    box.id = 'selected-tab-info';
    box.style.marginTop = '10px';

    // insert AFTER label
    label.insertAdjacentElement('afterend', box);
  }
}

function updateTabInfo() {
  const activeTab = document.querySelector('.e-tab-base[aria-selected="true"]');
  const box = document.getElementById('selected-tab-info');

  if (!activeTab || !box) return;

  const icon = activeTab.querySelector('.tab_icon')?.outerHTML || '';
  const title = activeTab.querySelector('.tab_btn-name')?.innerText || '';
  const price = activeTab.querySelector('.tab-sub-text')?.innerText || '';

  box.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      ${icon}
      <div>
        <strong>${title}</strong><br>
        <span>${price}</span>
      </div>
    </div>
  `;
}

// init
createTargetBox();
updateTabInfo();

// on tab click
document.querySelectorAll('.e-tab-base').forEach(tab => {
  tab.addEventListener('click', () => {
    setTimeout(() => {
      createTargetBox();
      updateTabInfo();
    }, 100);
  });
});
</script>
