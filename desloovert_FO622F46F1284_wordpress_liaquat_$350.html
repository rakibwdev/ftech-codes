  transition: background-size 0.1s linear;
   /* background-position: center;
  background-repeat: no-repeat;

}
</style>

<script>

// parallax effect

const parallaxItems = document.querySelectorAll('.parlax_image');

window.addEventListener('scroll', () => {
  requestAnimationFrame(() => {
    parallaxItems.forEach(el => {
      const rect = el.getBoundingClientRect();

      if (rect.top < window.innerHeight && rect.bottom > 0) {
        el.style.backgroundPositionY = rect.top * 0.2 + "px";
      }
    });
  });
});



// Autamsunco Video Parlax

</script>

<style>
.parlax_image .elementor-background-video-container iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.5);
  will-change: transform;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
const videos = document.querySelectorAll('.parlax_image .elementor-background-video-container iframe');

window.addEventListener('scroll', () => {
  videos.forEach(el => {
    const rect = el.closest('.parlax_image').getBoundingClientRect();

    if (rect.top < window.innerHeight && rect.bottom > 0) {
      el.style.transform = `
        translate(-50%, -50%)
        translateY(${rect.top * 0.5}px)
        scale(2)
      `;
    }
  });
});
});
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const videos = document.querySelectorAll('.parlax_image .elementor-background-video-container iframe');

  let ticking = false;

  function updateParallax() {
    videos.forEach(el => {
      const rect = el.closest('.parlax_image').getBoundingClientRect();

      if (rect.top < window.innerHeight && rect.bottom > 0) {
        const y = rect.top * 0.3;

        el.style.transform =
          `translate(-50%, calc(-50% + ${y}px)) scale(2)`;
      }
    });

    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(updateParallax);
      ticking = true;
    }
  });
});
</script>
