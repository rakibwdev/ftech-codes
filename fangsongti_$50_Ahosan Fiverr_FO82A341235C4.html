<style>
.checkbox_content > div {
    display: none;

}

.checkbox_content > div.is-active {
    display: block;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('.form_checkbox');
    const contents = document.querySelectorAll('.checkbox_content > div');

    if (!form || !contents.length) return;

    const checkboxes = form.querySelectorAll(
        'input[name="form_fields[name][]"]'
    );

    function updateContent() {
        const hasChecked = [...checkboxes].some(cb => cb.checked);

        contents.forEach((content, index) => {
            content.classList.toggle(
                'is-active',
                !hasChecked || (checkboxes[index] && checkboxes[index].checked)
            );
        });
    }

    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', updateContent);
    });

    updateContent();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuItems = document.querySelectorAll(".meg_menu li");
    const subMenuItems = document.querySelectorAll(".sub_meg_menu");

    menuItems.forEach((item, index) => {
        item.addEventListener("mouseenter", () => {
            if (subMenuItems[index]) {
                subMenuItems[index].style.display = "block";
            }
        });

        item.addEventListener("mouseleave", () => {
            if (subMenuItems[index]) {
                subMenuItems[index].style.display = "none";
            }
        });
    });
});
</script>
