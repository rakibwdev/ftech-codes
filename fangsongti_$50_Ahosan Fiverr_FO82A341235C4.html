<style>
     selector svg {
        transform: rotate(360deg) skew(30deg);
      }

       selector a {
        transform: rotate(360deg) skew(30deg);
      }


       selector ul{
        transform: rotate(360deg);
 }


 .sub-menu{
    transform: skew(30deg) !important;
    a{
        transform: skew(0deg) !important;
    }
}


selector .has-submenu{
    justify-content:space-between;
}

#search-edcc0f9::placeholder {
        transform: skew(30deg);
} 


/* .meg_menu{} */
.sub_meg_menu{
    display: none;
}



.e-n-menu-title {
    isolation: isolate;
}

.e-n-menu-title::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
}

.e-n-menu-item:hover .e-n-menu-title::before {
    transform: skewX(-30deg);
    background-color:red;
}

</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuItems = document.querySelectorAll(".meg_menu li");
    const subMenuItems = document.querySelectorAll(".sub_meg_menu");

    menuItems.forEach((item, index) => {
        item.addEventListener("mouseenter", () => {
            if (subMenuItems[index]) {
                subMenuItems[index].style.display = "block";
            }
        });

        item.addEventListener("mouseleave", () => {
            if (subMenuItems[index]) {
                subMenuItems[index].style.display = "none";
            }
        });
    });
});
</script>
