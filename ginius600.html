<style>
._lists {
    /* position: absolute; */
    transform: translateX(100px);
    opacity: 0;
    pointer-events: none;

    transition: all 0.3s ease;
}
[flot_status="true"] ._lists {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
}
.flot_open {
    opacity: 1;
    cursor: pointer;
    transition: all 0.3s ease;
}

[flot_status="true"] .flot_open {
    opacity: 0;
    pointer-events: none;
}
.flot_close {
    opacity: 0;
    transform: rotate(90deg);
    transition: all 0.3s ease;
    pointer-events: none;
}

[flot_status="true"] .flot_close {
    opacity: 1;
    cursor: pointer;
    pointer-events: auto;
    transform: rotate(45deg);
    transition: all 0.3s ease;
}
</style>

<script>

// floating Icon

const FloatOpen = document.querySelector('.flot_open');
const FloatClose = document.querySelector('.flot_close');
const FloatIcon = document.querySelector('.float_icon');

FloatOpen.addEventListener('click', () => {
    FloatIcon.setAttribute('flot_status', 'true');
});

FloatClose.addEventListener('click', () => {
    FloatIcon.setAttribute('flot_status', 'false');
});

</script>
