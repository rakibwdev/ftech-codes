<script>
    document.addEventListener("DOMContentLoaded", function () {
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach((tab, index) => {
        if ((index + 1) % 2 === 0) {
            tab.style.backgroundColor = "#f3f4f6"; // even
        } else {
            tab.style.backgroundColor = "#ffffff"; // odd
        }
    });
});


// first character

// document.querySelectorAll('.first_character').forEach(el => {
//   el.textContent = el.textContent.trim().charAt(0);
// });

const colors = [
  { bg: '#f0f8ff', text: '#3a8fd9', border: '#cfe8ff' },
  { bg: '#f0fbf4', text: '#2f9e5f', border: '#c9efd6' },
  { bg: '#fff6ed', text: '#d48a3a', border: '#ffd8a8' },
  { bg: '#f7f3ff', text: '#8e63c7', border: '#e2d4ff' },
  { bg: '#f0fdfa', text: '#2aa198', border: '#c7f3ec' },
  { bg: '#fff3f8', text: '#cc5c8a', border: '#ffd1e6' },
  { bg: '#f0f5ff', text: '#4c6ef5', border: '#d6e4ff' },
  { bg: '#fff9f0', text: '#c78a2c', border: '#ffe4b8' }
];

function applyFirstCharStyles() {
  document.querySelectorAll('.first_character').forEach(el => {

    if (el.dataset.styled) return; 

    const char = el.textContent.trim().charAt(0).toUpperCase();
    el.textContent = char;

    const index = Math.floor(Math.random() * colors.length);
    const colorSet = colors[index];

    el.style.backgroundColor = colorSet.bg;
    el.style.color = colorSet.text;
    el.style.border = `1px solid ${colorSet.border}`;

    el.dataset.styled = "true"; 
  });
}

// Run on page load
document.addEventListener("DOMContentLoaded", applyFirstCharStyles);

// Run on scroll (for dynamically loaded content)
window.addEventListener("scroll", applyFirstCharStyles);


</script>
