<script>
    document.addEventListener("DOMContentLoaded", function () {
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach((tab, index) => {
        if ((index + 1) % 2 === 0) {
            tab.style.backgroundColor = "#f3f4f6"; // even
        } else {
            tab.style.backgroundColor = "#ffffff"; // odd
        }
    });
});
</script>

<style>
     .elementor-loop-container > div:nth-child(even) .tab {
    background-color: #f3f4f6;
}

 .elementor-loop-container > div:nth-child(odd) .tab {
    background-color: #ffffff;
}
</style>
